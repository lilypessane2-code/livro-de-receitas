madura, sem sementes"], [200, "ml", "sumo de laranja"], [100, "g", "iogurte natural"], [0.5, "", "lima (o sumo)"], [null, "", "gelo; um fio de mel se a papaia estiver pouco doce"]], "steps": ["Tudo no liquidificador.", "Bate 45 segundos, até ficar cremoso e laranja.", "Serve logo — a papaia oxida depressa e perde a cor bonita."], "pair": ["Ao pequeno-almoço leve", "Depois de uma refeição pesada — ajuda a digestão", "Com torrada e queijo fresco"], "tip": "Papaia madura tem a casca amarelada e cede um pouco ao dedo. Verde, o batido fica sem graça nenhuma."}, {"pt": "Frango tikka masala", "en": "Chicken Tikka Masala", "cats": ["carne", "indiana", "caril"], "day": "🇮🇳 Indiana", "img": "https://res.cloudinary.com/dail4fbms/image/upload/c_limit,w_1920/f_auto/q_auto/v1712969156/A_picture_of_Chicken_Tikka_Masala_89d66c85cd?_a=BAVMn6B00", "desc": "O caril indiano mais famoso do mundo: frango marinado em iogurte, num molho cremoso de tomate e especiarias.", "prep": 20, "cook": 30, "total": 50, "diff": "Médio", "serves": 4, "ings": [[600, "g", "frango em cubos"], [150, "g", "iogurte natural (marinada) e 2 dentes de alho + gengibre ralado"], [2, "c. chá", "garam masala"], [400, "g", "tomate triturado"], [1, "", "cebola bem picada"], [150, "ml", "natas"], [null, "", "óleo, sal, paprica e coentros"]], "steps": ["Marina o frango no iogurte com alho, gengibre, sal e metade do garam masala, pelo menos 30 minutos.", "Doura o frango numa frigideira bem quente até ganhar cor. Guarda (não precisa de estar cozinhado por dentro).", "Na mesma frigideira, refoga a cebola até dourar bem. Junta o tomate e o resto das especiarias e coze 10 minutos, até o molho escurecer e engrossar.", "Tritura o molho (opcional, para ficar aveludado) e volta à frigideira com as natas.", "Junta o frango e coze 8 a 10 minutos no molho.", "Serve com coentros por cima."], "pair": ["Arroz basmati ou arroz jeera", "Pão naan de alho", "Raita (iogurte com pepino) ao lado"], "tip": "O molho triturado e bem apurado é a diferença entre 'caril caseiro' e 'caril de restaurante'."}, {"pt": "Biryani de frango", "en": "Chicken Biryani", "cats": ["arroz", "indiana", "carne"], "day": "🇮🇳 Indiana", "img": "https://i.pinimg.com/474x/a7/39/c2/a739c2f3639bccae6a71b15a5013519c.jpg", "desc": "O arroz de festa da Índia: basmati perfumado em camadas com frango especiado e cebola frita.", "prep": 30, "cook": 45, "total": 75, "diff": "Médio", "serves": 4, "ings": [[300, "g", "arroz basmati, demolhado 30 min"], [500, "g", "frango em pedaços"], [150, "g", "iogurte"], [2, "", "cebolas em fatias finas (metade frita até dourar)"], [2, "c. chá", "mistura biryani ou garam masala + açafrão em leite morno"], [null, "", "alho, gengibre, louro, cardamomo, sal, óleo e coentros/hortelã"]], "steps": ["Marina o frango no iogurte com alho, gengibre, especiarias e sal, 30 minutos.", "Coze o arroz em água bem salgada com louro e cardamomo só até 70% — ainda firme no meio. Escorre.", "Coze o frango marinado na sua panela 15 minutos, até formar um molho grosso.", "Monta em camadas na panela: arroz, frango, cebola frita, ervas, um fio do leite com açafrão. Repete.", "Tapa bem (a tampa com um pano, como se faz lá) e coze em lume mínimo 20 minutos, sem abrir.", "Repousa 10 minutos e envolve com cuidado, de baixo para cima, já na mesa."], "pair": ["Raita de iogurte e pepino", "Salada de cebola e tomate", "Pão naan"], "tip": "O arroz a 70% é o ponto crítico: acaba de cozer no vapor do frango. Cozido por completo antes, vira papa."}, {"pt": "Arroz jeera (basmati com cominhos)", "en": "Jeera Rice — Cumin Basmati", "cats": ["arroz", "indiana", "vegetariano"], "day": "🇮🇳 Indiana", "img": "https://m.yatribhojan.com/Uploads/16052026071632.jpeg", "desc": "O arroz que acompanha tudo na Índia: basmati soltinho, torrado com cominhos em manteiga.", "prep": 5, "cook": 20, "total": 25, "diff": "Fácil", "serves": 4, "ings": [[300, "g", "arroz basmati"], [1, "c. chá", "sementes de cominho"], [2, "c. sopa", "manteiga ghee ou manteiga normal"], [450, "ml", "água quente"], [null, "", "sal; 1 folha de louro (se quiseres)"]], "steps": ["Lava o arroz até a água sair quase limpa e demolha 20 minutos. Escorre.", "Aquece a manteiga e torra os cominhos 30 segundos, até cheirar bem.", "Junta o arroz escorrido e mexe 1 minuto, a envolver na manteiga.", "Deita a água quente e o sal, tapa e coze em lume mínimo 12 minutos.", "Desliga e repousa 10 minutos tapado. Solta com um garfo antes de servir."], "pair": ["Qualquer caril (tikka masala, dahl…)", "Frango grelhado especiado", "Legumes salteados"], "tip": "Nunca mexas o arroz enquanto coze e repousa. O vapor faz o trabalho — mexer parte os grãos."}, {"pt": "Pão naan de alho", "en": "Garlic Naan", "cats": ["indiana", "vegetariano"], "day": "🇮🇳 Indiana", "img": "https://fooddiscoveryapp.com/_next/image?url=https%3A%2F%2Fd3azhvew791s0n.cloudfront.net%2Frestaurants%2Faefc82c4-d637-4431-844b-2e984df0d1ea%2Fimage-1787763096617-Garlic_Naan.jpeg&w=768&q=70", "desc": "Pão indiano macio, feito na frigideira, pincelado com manteiga de alho. Sem forno especial.", "prep": 20, "cook": 15, "total": 35, "diff": "Médio", "serves": 4, "ings": [[300, "g", "farinha"], [1, "c. chá", "fermento de padeiro seco"], [125, "g", "iogurte natural"], [100, "ml", "água morna"], [50, "g", "manteiga derretida com 2 dentes de alho esmagados e coentros"]], "steps": ["Mistura farinha, fermento, uma pitada de açúcar e sal. Junta iogurte e água morna e amassa 5 minutos, até ficar macio.", "Tapa e deixa levedar 1 hora, até dobrar.", "Divide em 6 bolas e estende ovais finos com o rolo.", "Coze cada um numa frigideira bem quente e seca, 1 a 2 minutos de cada lado, até fazer bolhas e manchas tostadas.", "Pincela com a manteiga de alho mal sai da frigideira. Serve quente."], "pair": ["Para molhar em qualquer caril", "Com frango tikka masala", "Como base de 'pizza rápida' com queijo"], "tip": "Frigideira bem quente e sem gordura é o truque das bolhas e das manchas — é a imitar o forno tandoor."}, {"pt": "Samosas de legumes", "en": "Vegetable Samosas", "cats": ["indiana", "vegetariano"], "day": "🇮🇳 Indiana", "img": "https://foodie-haven.com/wp-content/uploads/2024/12/Samosas-728x728.webp", "desc": "Triângulos crocantes de batata e ervilhas especiadas. O petisco mais popular da Índia.", "prep": 30, "cook": 20, "total": 50, "diff": "Médio", "serves": 6, "ings": [[2, "", "batatas cozidas em cubos pequenos"], [100, "g", "ervilhas"], [1, "", "cebola picada, alho, gengibre e 1 c. chá de garam masala + cominhos"], [8, "folhas", "massa filo ou massa de rolinho (ou massa caseira simples)"], [null, "", "óleo para fritar (ou pincelar, na versão de forno); sal e coentros"]], "steps": ["Refoga cebola, alho e gengibre. Junta as especiarias, a batata e as ervilhas, esmaga um pouco e tempera. Este recheio tem de estar seco e frio.", "Corta as folhas de massa em tiras largas. Põe uma colher de recheio numa ponta e dobra em triângulo, virando sobre si mesma até ao fim.", "Cola a última ponta com um pouco de água com farinha.", "Frita em óleo quente até dourarem — ou assa a 200°C pinceladas com óleo, 15 minutos, virando a meio.", "Escorre em papel e serve quentes."], "pair": ["Chutney de hortelã ou de manga", "Molho de iogurte", "Um chá especiado (chai)"], "tip": "Recheio quente ou molhado abre a samosa no óleo. Frio e seco, sempre."}, {"pt": "Dahl de lentilhas vermelhas", "en": "Red Lentil Dahl", "cats": ["indiana", "vegetariano", "caril"], "day": "🇮🇳 Indiana", "img": "https://www.kitchensanctuary.com/wp-content/uploads/2025/10/Red-Lentil-Dal-wide-seo.jpg", "desc": "O caril de todos os dias na Índia: lentilhas que se desfazem num molho dourado de curcuma e cominhos.", "prep": 10, "cook": 25, "total": 35, "diff": "Fácil", "serves": 4, "ings": [[250, "g", "lentilhas vermelhas, bem lavadas"], [1, "", "cebola picada"], [2, "dentes", "alho e gengibre ralado"], [1, "c. chá", "curcuma e outra de cominhos"], [400, "ml", "água ou caldo (mais, se for preciso)"], [null, "", "óleo ou ghee, sal, limão e coentros"]], "steps": ["Refoga a cebola em óleo até dourar. Junta alho, gengibre e especiarias, 1 minuto.", "Junta as lentilhas e a água. Coze 20 minutos, mexendo de vez em quando — elas desfazem-se sozinhas.", "Se engrossar demais, junta água quente: o dahl deve ficar como uma sopa grossa.", "Tempera com sal e umas gotas de limão.", "Truque final (tadka): aquece um fio de óleo com cominhos e alho laminado até chiar e deita por cima, já na tigela."], "pair": ["Arroz jeera", "Pão naan", "Espinafres salteados ao lado"], "tip": "As lentilhas vermelhas não precisam de demolha e cozem depressa — é a receita indiana mais fácil para começar."}, {"pt": "Lassi de manga", "en": "Mango Lassi", "cats": ["batidos", "indiana"], "day": "🇮🇳 Indiana", "img": "https://marhabavictoria.com/wp-content/uploads/2025/06/Mango-Lassi.jpg", "desc": "A bebida de iogurte e manga dos restaurantes indianos: cremosa, fria e um bocadinho especiada.", "prep": 5, "cook": 0, "total": 5, "diff": "Fácil", "serves": 2, "ings": [[1, "", "manga bem madura"], [250, "g", "iogurte natural"], [100, "ml", "leite"], [1, "c. sopa", "mel ou açúcar"], [null, "", "uma pitada de cardamomo (o toque indiano); gelo"]], "steps": ["Tudo no liquidificador, com gelo.", "Bate até ficar bem cremoso e com espuma por cima.", "Prova: o cardamomo deve sentir-se só no fundo, não dominar.", "Serve em copos altos, bem frio."], "pair": ["Depois de um caril picante — apaga o fogo como nada", "Ao lanche, sozinho", "Com samosas, para um lanche indiano completo"], "tip": "Lassi é o antídoto oficial do picante: o iogurte acalma o que a água não consegue."}, {"pt": "Escondidinho de carne com puré de mandioca", "en": "Brazilian Beef Escondidinho with Cassava Mash", "cats": ["brasileira", "carne"], "day": "🇧🇷 Brasileira", "img": "https://receitas.biomi.space/uploads/livro/imports/receitas/2026/08/escondidinho-de-carne-seca-com-mandioca-0ec40f66.webp", "desc": "Carne temperada 'escondida' debaixo de um puré cremoso de mandioca, gratinado no forno.", "prep": 25, "cook": 35, "total": 60, "diff": "Médio", "serves": 4, "ings": [[800, "g", "mandioca descascada em pedaços"], [400, "g", "carne picada ou carne seca desfiada já demolhada"], [1, "", "cebola picada e 2 dentes de alho"], [2, "", "tomates picados"], [100, "ml", "leite e 1 c. sopa de manteiga (para o puré)"], [100, "g", "queijo ralado"], [null, "", "azeite, sal, pimenta e salsa"]], "steps": ["Coze a mandioca em água com sal até ficar muito macia, uns 25 minutos. Tira a fibra do meio.", "Faz um puré com o leite quente e a manteiga. Tempera — deve ficar cremoso, não seco.", "Refoga cebola e alho, junta a carne e doura. Junta o tomate e coze 8 minutos, até virar um recheio húmido mas sem molho a mais.", "Num tabuleiro: carne por baixo, puré por cima, alisado com uma colher molhada.", "Queijo por cima e forno a 200°C por 15 minutos, até gratinar."], "pair": ["Salada verde", "Arroz branco ao lado", "Vinagrete de tomate e cebola"], "tip": "Purè de mandioca seca racha no forno. Se estiver firme demais, junta mais leite quente sem medo."}, {"pt": "Strogonoff de frango", "en": "Brazilian Chicken Stroganoff", "cats": ["brasileira", "carne"], "day": "🇧🇷 Brasileira", "img": "https://planetareceitas.com.br/wp-content/uploads/2023/05/Strogonoff-de-Frango.webp", "desc": "A versão brasileira do strogonoff: cremoso, com ketchup e mostarda, e batata palha por cima — sempre.", "prep": 10, "cook": 20, "total": 30, "diff": "Fácil", "serves": 4, "ings": [[600, "g", "frango em cubos"], [1, "", "cebola picada e 2 dentes de alho"], [200, "g", "cogumelos (opcional, mas clássico)"], [3, "c. sopa", "ketchup e 1 c. sopa de mostarda"], [200, "ml", "natas"], [null, "", "azeite, sal, pimenta; batata palha para servir"]], "steps": ["Tempera e doura o frango em azeite bem quente, em duas vezes para não cozer em vez de dourar. Guarda.", "Refoga a cebola, o alho e os cogumelos na mesma frigideira.", "Volta o frango, junta ketchup e mostarda e mexe 1 minuto.", "Baixa o lume, junta as natas e aquece sem ferver, 2 a 3 minutos, até o molho ficar rosado e cremoso.", "Serve já, com a batata palha por cima na mesa — nunca dentro da panela."], "pair": ["Arroz branco (obrigatório)", "Batata palha (também obrigatório)", "Salada simples"], "tip": "Natas a ferver talham e separam. Molho pronto = lume baixo e nada de pressa no fim."}, {"pt": "Feijão tropeiro", "en": "Tropeiro Beans", "cats": ["brasileira"], "day": "🇧🇷 Brasileira", "img": "https://odicasaalimentos.com.br/wp-content/uploads/2025/01/img_feijao_tropeiro.webp", "desc": "Feijão com farinha de mandioca, couve e bacon — a comida dos viajantes de Minas Gerais.", "prep": 15, "cook": 30, "total": 45, "diff": "Médio", "serves": 4, "ings": [[400, "g", "feijão cozido e escorrido (frade ou carioca)"], [150, "g", "bacon em cubos"], [100, "g", "linguiça em rodelas"], [150, "g", "farinha de mandioca"], [200, "g", "couve cortada muito fina"], [3, "", "ovos cozidos ou mexidos em pedaços"], [null, "", "cebola, alho, sal e pimenta"]], "steps": ["Frita o bacon e a linguiça até dourarem. Guarda a gordura na frigideira — é sabor.", "Refoga cebola e alho nessa gordura.", "Junta o feijão escorrido e mexe 3 minutos, sem caldo.", "Vai juntando a farinha aos poucos, mexendo, até ficar soltinho como uma farofa húmida.", "Junta a couve só no fim, 1 minuto — deve ficar verde viva.", "Mistura os ovos e serve logo."], "pair": ["Arroz branco", "Laranja às fatias", "Costelinha ou frango assado ao lado", "Piri-piri para quem gosta"], "tip": "Farinha demais seca o prato. Junta aos poucos e para quando estiver soltinho, não quando acabar o pacote."}, {"pt": "Tapioca com queijo", "en": "Brazilian Tapioca Crepe", "cats": ["brasileira", "vegetariano"], "day": "🇧🇷 Brasileira", "img": "https://umdiabetico.com.br/wp-content/uploads/2026/08/tapioca-ou-crepioca-ovo-diabetes.jpg", "desc": "Crepe sem glúten feito só com goma de mandioca, na frigideira, em três minutos.", "prep": 5, "cook": 5, "total": 10, "diff": "Fácil", "serves": 2, "ings": [[100, "g", "goma de tapioca hidratada (vende-se pronta)"], [4, "fatias", "queijo (muçarela ou queijo coalho)"], [null, "", "uma pitada de sal; manteiga (opcional)"]], "steps": ["Peneira a goma directamente para uma frigideira antiaderente fria, espalhando numa camada fina e uniforme.", "Liga o lume médio. Em 1 a 2 minutos a goma liga-se e vira um disco — não se vira.", "Põe o queijo numa metade, dobra ao meio e espera derreter, 1 minuto.", "Serve logo, ainda quente e flexível."], "pair": ["Café, como no Nordeste do Brasil", "Recheios: requeijão, coco com leite condensado (doce), frango desfiado, ovo mexido", "Sumo de fruta ao lado"], "tip": "Camada fina e uniforme é tudo. Grossa demais, fica borracha; com buracos, parte-se ao dobrar."}, {"pt": "Bacalhau à lagareiro", "en": "Cod à Lagareiro — Olive Oil Roasted Cod", "cats": ["portuguesa", "peixe"], "day": "🇵🇹 Portuguesa", "img": "https://mariascookbook.com/wp-content/uploads/2023/03/fotor_2023-3-16_11_40_28-min.jpg", "desc": "Lombos de bacalhau assados em muito azeite bom, com batatinhas a murro e alho dourado.", "prep": 15, "cook": 35, "total": 50, "diff": "Médio", "serves": 4, "ings": [[4, "lombos", "bacalhau demolhado"], [600, "g", "batatinhas com casca"], [6, "dentes", "alho laminado"], [200, "ml", "azeite bom (é o molho!)"], [null, "", "louro, sal, pimenta e salsa; azeitonas (se quiseres)"]], "steps": ["Coze as batatinhas com casca em água com sal até quase macias. Dá-lhes um murro leve para abrirem.", "Põe o bacalhau num tabuleiro, à volta as batatas a murro, o louro e metade do azeite.", "Forno a 200°C por 20 minutos.", "Aquece o resto do azeite com o alho laminado até dourar ligeiramente — cuidado, alho queimado amarga.", "Deita o azeite com alho bem quente por cima de tudo, já na mesa. Polvilha com salsa."], "pair": ["Grelos ou espinafres salteados", "Salada de tomate", "Pão para o azeite — vais precisar"], "tip": "'Lagareiro' vem de lagar, onde se faz o azeite. Aqui o azeite não é tempero: é ingrediente principal. Usa o melhor que tiveres."}, {"pt": "Bitoque", "en": "Portuguese Steak, Egg & Fries — Bitoque", "cats": ["portuguesa", "carne"], "day": "🇵🇹 Portuguesa", "img": "https://outsider.pt/wp-content/uploads/2023/10/bitoque-1-1-fotor-20231027153928-min-1-min.jpg", "desc": "O prato de tasca mais amado de Portugal: bife com alho e louro, ovo a cavalo e batatas fritas.", "prep": 10, "cook": 20, "total": 30, "diff": "Fácil", "serves": 2, "ings": [[2, "", "bifes de vaca finos"], [3, "dentes", "alho esmagado"], [2, "folhas", "louro"], [50, "ml", "vinho branco"], [2, "", "ovos"], [300, "g", "batatas para fritar"], [null, "", "manteiga e azeite, sal e pimenta; arroz e salada, para acompanhar"]], "steps": ["Tempera os bifes com alho, louro, sal e pimenta. Deixa 15 minutos.", "Frita as batatas até dourarem e põe sal. Mantém quentes.", "Frigideira bem quente com azeite e um pouco de manteiga: frita os bifes 2 a 3 minutos de cada lado.", "Tira os bifes, deita o vinho na frigideira e raspa o fundo — é o molho, 1 minuto.", "Estrela os ovos e põe um em cima de cada bife ('a cavalo').", "Serve com o molho por cima, batatas, arroz e salada no mesmo prato, como na tasca."], "pair": ["Arroz branco e salada (o trio clássico)", "Pão para o molho", "Um copo de vinho tinto da casa, para os adultos"], "tip": "Bife fino coze depressa. Frigideira a sério quente e pouco tempo — bitoque cinzento e seco é o único erro possível."}, {"pt": "Açorda alentejana", "en": "Alentejo Bread & Coriander Soup", "cats": ["portuguesa", "sopas"], "day": "🇵🇹 Portuguesa", "img": "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhYAlGepbAJp1E7Fie8e_gb4qGzIn25f9VuzA0ynZEzD3c9kQD733ZAkawhUMN85-3ZcHL6hvSXx0BELPHZRPoW6dgPZFe0Pbm_9tZvJ-8hlCRFlTgyhZbkqyMhTBwThbT__1PKRqON5I0/s1600/A%25C3%25A7orda-Alentejana-sopa-portuguesa-Blueberries-and-Olives-3.jpg", "desc": "Sopa de pão, alho e coentros com ovo escalfado — pobre na origem, riquíssima no sabor.", "prep": 10, "cook": 15, "total": 25, "diff": "Fácil", "serves": 4, "ings": [[200, "g", "pão alentejano ou rústico, de preferência do dia anterior, em fatias"], [4, "dentes", "alho"], [1, "molho grande", "coentros"], [4, "", "ovos"], [1200, "ml", "água a ferver"], [null, "", "azeite generoso e sal"]], "steps": ["Pisa o alho com os coentros e sal num almofariz (ou pica tudo muito bem) até virar uma pasta verde.", "Põe a pasta numa terrina, junta um bom fio de azeite e as fatias de pão por cima.", "Escalfa os ovos na água a ferver com sal, 3 minutos, e tira com uma escumadeira.", "Deita a água a ferver sobre o pão, tapa e espera 5 minutos — o pão incha e vira uma sopa grossa.", "Destapa, mexe uma vez, e põe um ovo escalfado em cada prato."], "pair": ["Sozinha, como refeição leve completa", "Com bacalhau cozido desfiado por cima (versão rica)", "Azeitonas alentejanas ao lado"], "tip": "A açorda não vai ao lume depois da água entrar. Se a cozinhares, perde a alma — é sopa de terrina, não de panela."}, {"pt": "Arroz de tomate", "en": "Portuguese Tomato Rice", "cats": ["portuguesa", "arroz", "vegetariano"], "day": "🇵🇹 Portuguesa", "img": "https://www.carolinescooking.com/wp-content/uploads/2024/04/Portuguese-tomato-rice-photo.jpg", "desc": "Arroz malandrinho (soltinho e caldoso ao mesmo tempo), o acompanhamento português por excelência.", "prep": 10, "cook": 25, "total": 35, "diff": "Fácil", "serves": 4, "ings": [[300, "g", "arroz carolino"], [3, "", "tomates maduros picados (ou 300 g de tomate triturado)"], [1, "", "cebola picada e 2 dentes de alho"], [900, "ml", "água quente"], [null, "", "azeite, 1 folha de louro, sal e salsa"]], "steps": ["Refoga a cebola e o alho em azeite até amolecer.", "Junta o tomate e o louro e coze 5 minutos, até virar um molho vermelho e o azeite começar a aparecer por cima.", "Junta o arroz, mexe 1 minuto.", "Deita a água quente e o sal. Coze em lume médio 12 a 15 minutos.", "Desliga ainda com um bocadinho de caldo — 'malandrinho' é assim. Salsa por cima e serve logo."], "pair": ["Peixe frito ou grelhado (o par clássico)", "Frango assado", "Feijoada — o arroz de tomate corta a gordura"], "tip": "Não deixes o arroz à espera: absorve o caldo na panela e passa de malandrinho a seco em 10 minutos."}, {"pt": "Frango com molho de amendoim", "en": "Chicken in Peanut Sauce", "cats": ["mocambicana", "carne"], "day": "🇲🇿 Moçambicana", "img": "https://snapcalorie-webflow-website.s3.us-east-2.amazonaws.com/media/food_pics_v2/medium/chicken_in_peanut_butter_sauce.jpg", "desc": "Frango cozinhado devagar no molho de amendoim que também aparece na matapa — aqui, ele é a estrela.", "prep": 15, "cook": 35, "total": 50, "diff": "Fácil", "serves": 4, "ings": [[800, "g", "frango em pedaços"], [150, "g", "amendoim moído (ou manteiga de amendoim natural)"], [1, "", "cebola picada e 2 dentes de alho"], [2, "", "tomates picados"], [400, "ml", "água quente"], [null, "", "óleo, sal e piri-piri a gosto"]], "steps": ["Tempera e doura o frango em óleo bem quente. Guarda.", "Refoga a cebola e o alho no mesmo tacho. Junta o tomate e coze 5 minutos.", "Mistura o amendoim com a água quente até ficar um leite grosso e junta ao tacho.", "Volta o frango, tapa e coze em lume brando 25 minutos, mexendo de vez em quando para o amendoim não pegar.", "Quando o molho estiver cremoso e o frango tenro, acerta sal e piri-piri."], "pair": ["Arroz branco", "Xima", "Couve salteada com alho"], "tip": "O amendoim pega no fundo com facilidade. Lume brando e mexer a sério nos últimos 10 minutos."}, {"pt": "Rissóis de camarão", "en": "Prawn Rissoles", "cats": ["mocambicana", "peixe"], "day": "🇲🇿 Moçambicana", "img": "https://amodadoflavio.pt/wp-content/uploads/2018/06/Riss%C3%B3is-de-camar%C3%A3o.png", "desc": "Meias-luas de massa fina com creme de camarão — petisco de festa em Moçambique e em Portugal.", "prep": 40, "cook": 20, "total": 60, "diff": "Médio", "serves": 6, "ings": [[250, "g", "farinha (massa) e 250 ml de água + 1 c. sopa de manteiga"], [300, "g", "camarão descascado picado"], [200, "ml", "leite e 1 c. sopa de farinha (para o creme)"], [1, "", "cebola bem picada e 1 dente de alho"], [null, "", "salsa, sal, pimenta, limão; ovo e pão ralado para panar; óleo para fritar"]], "steps": ["Massa: ferve a água com manteiga e sal, junta a farinha de uma vez e mexe até virar uma bola lisa. Amassa morna e deixa repousar tapada.", "Recheio: refoga cebola e alho, junta o camarão 2 minutos. Polvilha a farinha, junta o leite aos poucos até virar um creme grosso. Tempera com sal, pimenta, limão e salsa. Deixa arrefecer por completo.", "Estende a massa fina, corta círculos de 9-10 cm.", "Põe uma colher de recheio, dobra em meia-lua e fecha as bordas com um garfo.", "Passa por ovo e pão ralado e frita em óleo quente até dourarem."], "pair": ["Molho de piri-piri suave", "Salada simples", "Como entrada de festa, com sumos frios"], "tip": "A massa dos rissóis é a mesma da coxinha — cozida na panela. E o recheio frio e grosso é o que impede que arrebentem no óleo."}, {"pt": "Caril de peixe à moçambicana", "en": "Mozambican Fish Curry", "cats": ["mocambicana", "caril", "peixe"], "day": "🇲🇿 Moçambicana", "img": "http://madguru.dk/assets/opskrifter/caril-de-peixe-mozambiquisk-fiskecurry-kokos.jpg", "desc": "Peixe em molho de coco e tomate com o calorzinho do piri-piri — o caril da costa.", "prep": 15, "cook": 20, "total": 35, "diff": "Fácil", "serves": 4, "ings": [[600, "g", "peixe firme em postas ou cubos grandes"], [1, "", "cebola picada e 2 dentes de alho"], [2, "", "tomates picados"], [400, "ml", "leite de coco"], [1, "c. sopa", "caril em pó"], [null, "", "óleo, sal, limão, coentros e piri-piri a gosto"]], "steps": ["Tempera o peixe com sal e limão. Guarda — entra só no fim.", "Refoga a cebola e o alho em óleo. Junta o caril, mexe 30 segundos.", "Junta o tomate e coze 5 minutos, até virar molho.", "Deita o leite de coco, deixa ferver devagar 5 minutos.", "Põe o peixe com cuidado e coze 8 a 10 minutos sem mexer muito, só a abanar o tacho.", "Coentros por cima e serve logo."], "pair": ["Arroz branco ou de coco", "Xima", "Pão para o molho"], "tip": "Peixe em cubos grandes e pouco mexido: é o que separa um caril bonito de uma papa de peixe."}, {"pt": "Bobotie", "en": "South African Bobotie", "cats": ["sulafricana", "carne"], "day": "🇿🇦 Sul-Africana", "img": "https://bipolarjourney.org.za/food/images/bobotie.jpg", "desc": "O prato nacional da África do Sul: carne picada especiada e doce, com cobertura de ovo e leite.", "prep": 20, "cook": 40, "total": 60, "diff": "Médio", "serves": 4, "ings": [[500, "g", "carne picada de vaca"], [1, "", "cebola picada"], [1, "fatia", "pão embebido em leite"], [2, "c. sopa", "caril em pó e 1 c. chá de curcuma"], [50, "g", "passas"], [2, "", "ovos e 200 ml de leite (cobertura)"], [null, "", "óleo, sal, louro e chutney de manga (se tiveres)"]], "steps": ["Refoga a cebola, junta a carne e doura. Junta caril e curcuma e mexe 1 minuto.", "Junta o pão espremido e esfarelado, as passas, sal e um pouco de chutney. Coze 5 minutos.", "Passa para um tabuleiro e alisa.", "Bate os ovos com o leite e uma pitada de curcuma e deita por cima. Põe folhas de louro na cobertura.", "Forno a 180°C por 30 a 35 minutos, até a cobertura firmar e dourar.", "Repousa 10 minutos antes de servir."], "pair": ["Arroz amarelo com passas (o par clássico)", "Salada de tomate e cebola", "Chutney ao lado"], "tip": "O contraste doce-salgado-especiado é a alma do bobotie. Não saltes as passas nem o pão — são eles que dão a textura certa."}, {"pt": "Bunny chow", "en": "Bunny Chow — Curry in a Bread Loaf", "cats": ["sulafricana", "caril", "carne"], "day": "🇿🇦 Sul-Africana", "img": "https://chowhound.com/img/gallery/19-types-of-curries-from-around-the-world/bunny-chow-south-africa-1740450638.jpg", "desc": "De Durban: meio pão escavado e cheio de caril picante. Come-se com as mãos, rasgando o pão.", "prep": 15, "cook": 35, "total": 50, "diff": "Médio", "serves": 2, "ings": [[1, "", "pão de forma inteiro pequeno (ou 2 metades grandes)"], [400, "g", "frango ou borrego em cubos (ou feijão, na versão vegetariana)"], [1, "", "cebola, alho, gengibre e 2 c. sopa de caril em pó"], [2, "", "tomates picados e 1 batata em cubos"], [null, "", "óleo, sal e coentros"]], "steps": ["Faz um caril normal: refoga cebola, alho e gengibre, junta o caril em pó, o tomate e coze 10 minutos.", "Junta a carne e a batata e coze em lume brando até ficar tenro e o molho grosso, uns 25 minutos.", "Corta o topo do pão e tira o miolo com cuidado, sem furar as paredes — o pão é a tigela.", "Enche bem com o caril quente e põe o 'chapéu' de pão por cima.", "Serve logo, com o miolo ao lado para molhar. Come-se com as mãos."], "pair": ["Salada de cenoura ralada com piri-piri (sambals)", "Iogurte, para o picante", "Sozinho — já traz a 'tigela' e o acompanhamento"], "tip": "O molho tem de ser grosso: molho aguado ensopa o pão e a tigela desfaz-se na mão."}, {"pt": "Chakalaka com pap", "en": "Chakalaka & Pap", "cats": ["sulafricana", "vegetariano"], "day": "🇿🇦 Sul-Africana", "img": "https://traveltank.com/blog/wp-content/uploads/2024/05/Chakalaka-Pap-1024x751.jpg", "desc": "Chakalaka: feijão e legumes picantes. Pap: a papa firme de milho branco, prima da xima.", "prep": 10, "cook": 30, "total": 40, "diff": "Fácil", "serves": 4, "ings": [[1, "lata", "feijão cozido (400 g)"], [1, "", "cebola, 1 pimento e 2 cenouras raladas"], [2, "", "tomates picados"], [1, "c. sopa", "caril em pó; piri-piri a gosto"], [250, "g", "farinha de milho branca (para o pap)"], [750, "ml", "água (para o pap); sal e óleo"]], "steps": ["Chakalaka: refoga cebola, pimento e cenoura em óleo 5 minutos. Junta o caril e o tomate e coze 10 minutos.", "Junta o feijão com um pouco do seu líquido e coze mais 10 minutos. Deve ficar grosso e picante. Acerta o sal.", "Pap: ferve a água com sal. Deita a farinha em chuva, mexendo sempre com uma colher de pau forte.", "Coze o pap em lume brando 20 minutos, mexendo com força de vez em quando, até ficar firme e a descolar da panela.", "Serve o pap em montinhos com a chakalaka por cima ou ao lado."], "pair": ["Carne grelhada (braai!) — o par clássico", "Frango assado", "Salada verde"], "tip": "Pap e xima são da mesma família: a diferença está no ponto. O pap sul-africano faz-se mais firme, para aguentar o molho por cima."}, {"pt": "Pudim Malva", "en": "Malva Pudding", "cats": ["sulafricana", "sobremesas", "bolos"], "day": "🇿🇦 Sul-Africana", "img": "https://wp.expatexplore.com/wp-content/uploads/2023/06/MalvaPudding.jpg", "desc": "Bolo esponja de alperce que se banha num molho de manteiga e natas ainda quente. Conforto puro.", "prep": 15, "cook": 35, "total": 50, "diff": "Fácil", "serves": 6, "ings": [[200, "g", "açúcar e 2 ovos"], [200, "g", "farinha e 1 c. chá de bicarbonato"], [2, "c. sopa", "doce de alperce (jam)"], [200, "ml", "leite e 1 c. sopa de vinagre"], [150, "ml", "natas + 50 g manteiga + 80 g açúcar (molho)"]], "steps": ["Bate ovos e açúcar até ficar fofo. Junta o doce de alperce.", "Envolve a farinha e o bicarbonato, alternando com o leite com vinagre.", "Tabuleiro untado, forno a 180°C por 30 a 35 minutos, até dourar bem.", "Molho: ferve natas, manteiga e açúcar 2 minutos.", "Mal o bolo saia do forno, pica-o com um garfo e deita o molho quente por cima, devagar — ele bebe tudo.", "Serve morno."], "pair": ["Natas batidas ou gelado de baunilha", "Custard (creme inglês) — o par clássico sul-africano", "Café, depois de um braai"], "tip": "O molho deita-se com o bolo a escaldar e em duas vezes: metade, espera absorver, outra metade. É isso que o deixa húmido por dentro."}, {"pt": "Tacos de frango", "en": "Chicken Tacos", "cats": ["mexicana", "carne"], "day": "🇲🇽 Mexicana", "img": "https://recipesharing.net/wp-content/uploads/2026/01/Mexican-Chicken-Tacos-34-768x512.png", "desc": "Tortillas mornas, frango especiado desfiado e tudo fresco por cima. Cada um monta o seu.", "prep": 20, "cook": 20, "total": 40, "diff": "Fácil", "serves": 4, "ings": [[500, "g", "frango (peito ou perna)"], [8, "", "tortillas de milho ou de trigo pequenas"], [1, "c. chá", "cominhos, paprica e orégãos (tempero do frango)"], [1, "", "cebola roxa em fatias finas"], [null, "", "tomate em cubos, alface, coentros, lima, queijo ralado e natas azedas ou iogurte"]], "steps": ["Tempera o frango e grelha ou coze até ficar tenro. Desfia com dois garfos.", "Aquece o frango desfiado numa frigideira com um pouco da água da cozedura e acerta os temperos — deve ficar suculento, não seco.", "Aquece as tortillas uma a uma numa frigideira seca, 30 segundos de cada lado, e guarda-as enroladas num pano.", "Põe tudo na mesa em tigelas: frango, tomate, cebola, alface, queijo, coentros, lima e o molho branco.", "Cada pessoa monta o seu taco: tortilla, frango, frescos por cima, um fio de lima."], "pair": ["Guacamole e nachos", "Arroz à mexicana (com tomate e ervilhas)", "Feijão preto temperado ao lado"], "tip": "Tortilla fria parte-se; tortilla morna dobra-se. Os 30 segundos na frigideira seca não são opcionais."}, {"pt": "Guacamole com nachos", "en": "Guacamole & Nachos", "cats": ["mexicana", "vegetariano"], "day": "🇲🇽 Mexicana", "img": "https://quickcookingmagic.com/wp-content/uploads/2025/12/0_0-1765574365952.jpeg", "desc": "Abacate esmagado com lima, cebola e coentros. Faz-se em 10 minutos e desaparece em 5.", "prep": 10, "cook": 0, "total": 10, "diff": "Fácil", "serves": 4, "ings": [[2, "", "abacates bem maduros"], [0.5, "", "cebola roxa bem picada"], [1, "", "tomate sem sementes em cubinhos"], [1, "", "lima (o sumo)"], [null, "", "coentros picados, sal e piri-piri ou jalapeño (se quiseres); nachos para servir"]], "steps": ["Abre os abacates, tira o caroço e deita a polpa numa tigela.", "Esmaga com um garfo — com pedaços, nunca no liquidificador.", "Junta cebola, tomate, coentros, sal e o sumo de lima logo a seguir, para não escurecer.", "Prova e acerta: guacamole sem sal e sem lima sabe a nada, por muita fruta boa que tenha.", "Serve logo, com os nachos à volta."], "pair": ["Como entrada de um jantar mexicano", "Por cima de tacos e quesadillas", "Com ovos mexidos, ao pequeno-almoço mexicano"], "tip": "Abacate maduro cede à palma da mão sem apertar os dedos. Duro = sem sabor e impossível de esmagar bem."}, {"pt": "Quesadillas de frango e queijo", "en": "Chicken & Cheese Quesadillas", "cats": ["mexicana", "carne"], "day": "🇲🇽 Mexicana", "img": "https://www.herpantrypro.com/wp-content/uploads/2025/08/The_Best_Chicken_Quesadillas_xkozuv.webp", "desc": "Tortilla crocante com queijo a derreter e frango temperado. O jantar rápido perfeito.", "prep": 10, "cook": 10, "total": 20, "diff": "Fácil", "serves": 2, "ings": [[2, "", "tortillas grandes de trigo"], [150, "g", "frango já cozinhado e desfiado"], [120, "g", "queijo ralado que derreta bem"], [0.5, "", "pimento em tiras finas"], [null, "", "cominhos e paprica; um fio de óleo"]], "steps": ["Tempera o frango com cominhos, paprica e sal.", "Espalha queijo por metade de cada tortilla, frango e pimento por cima, mais um pouco de queijo (é a 'cola').", "Dobra ao meio e coze numa frigideira com um fio de óleo, 2 a 3 minutos de cada lado, até ficar crocante e o queijo derreter.", "Repousa 1 minuto e corta em triângulos.", "Serve quente."], "pair": ["Guacamole", "Natas azedas ou iogurte", "Salada simples com lima"], "tip": "Queijo dos dois lados do recheio cola a quesadilla. Só no meio, ela abre-se toda ao cortar."}, {"pt": "Churros com chocolate", "en": "Churros with Chocolate Sauce", "cats": ["mexicana", "sobremesas"], "day": "🇲🇽 Mexicana", "img": "https://twicpics.tefal.de/https://dam.groupeseb.com/m/130902bbbc625409/Medium-Churros-sauce-chocolat-Churros-with-chocolate-sauce-png.png?timestamp=20260217094535&twic=v1/quality=70/resize=1800", "desc": "Palitos de massa frita com açúcar e canela, para molhar em chocolate quente e grosso.", "prep": 20, "cook": 15, "total": 35, "diff": "Médio", "serves": 4, "ings": [[250, "ml", "água e 50 g de manteiga"], [150, "g", "farinha"], [2, "", "ovos"], [100, "g", "açúcar com 1 c. chá de canela (para envolver)"], [150, "g", "chocolate negro + 150 ml de leite e 1 c. chá de amido (molho)"], [null, "", "óleo para fritar; uma pitada de sal"]], "steps": ["Ferve a água com manteiga e sal. Junta a farinha de uma vez e mexe até virar uma bola lisa (é a mesma massa dos rissóis!).", "Tira do lume, deixa amornar e junta os ovos um a um, batendo bem — fica uma massa grossa e brilhante.", "Põe a massa num saco de pasteleiro com bico de estrela grosso.", "Aperta tiras de 12-15 cm directamente para o óleo quente, cortando com uma tesoura. Frita até dourarem.", "Escorre e envolve logo no açúcar com canela, ainda quentes.", "Molho: aquece o leite com o chocolate e o amido até engrossar. Serve os churros com o chocolate ao lado, para molhar."], "pair": ["Café ou leite, ao lanche", "Como fim de um jantar mexicano", "Sozinhos, ainda quentes — a melhor maneira"], "tip": "Sem saco de pasteleiro, usa um saco de congelação com um canto cortado. As ranhuras do bico de estrela é que dão o crocante clássico, mas o sabor é o mesmo."}, {"pt": "Ramen fácil de frango", "en": "Easy Chicken Ramen", "cats": ["japonesa", "sopas"], "day": "🇯🇵 Japonesa", "img": "https://metrochefusa.com/wp-content/uploads/2025/12/Chicken_Ramen_Bowl_2.png", "desc": "A sopa japonesa de noodles: caldo rico, frango, ovo com a gema cremosa e tudo arrumadinho por cima.", "prep": 15, "cook": 25, "total": 40, "diff": "Médio", "serves": 2, "ings": [[1200, "ml", "caldo de galinha"], [2, "peitos", "frango"], [2, "", "ovos"], [150, "g", "noodles de ramen ou de ovo"], [2, "c. sopa", "molho de soja e 1 c. sopa de pasta miso (se tiveres)"], [null, "", "gengibre, alho, cebolinho, milho e óleo de sésamo"]], "steps": ["Coze os ovos 6 minutos e meio em água a ferver. Passa por água fria e descasca — a gema deve ficar cremosa.", "No caldo com gengibre e alho, coze o frango 12 minutos. Tira, desfia ou fatia.", "Tempera o caldo com soja e miso. Prova: deve estar bem saboroso, é ele que tempera tudo.", "Coze os noodles à parte, pelo tempo da embalagem. Escorre.", "Monta as tigelas: noodles, caldo quente por cima, frango, meio ovo, milho e cebolinho. Um fio de óleo de sésamo no fim."], "pair": ["Gyoza ou onigiri ao lado", "Chá verde", "Sozinho — uma tigela de ramen é uma refeição"], "tip": "O ovo de 6 minutos e meio é sagrado no ramen: gema dura estraga a tigela, gema líquida perde-se no caldo."}, {"pt": "Frango teriyaki", "en": "Chicken Teriyaki", "cats": ["japonesa", "carne"], "day": "🇯🇵 Japonesa", "img": "https://www.hertastetreats.com/wp-content/uploads/2025/09/Teriyaki_Chicken_Rice_Bowls_xkqid7.webp", "desc": "Frango brilhante e caramelizado no molho teriyaki caseiro de 4 ingredientes.", "prep": 10, "cook": 15, "total": 25, "diff": "Fácil", "serves": 4, "ings": [[600, "g", "coxas de frango desossadas, com pele se possível"], [4, "c. sopa", "molho de soja"], [3, "c. sopa", "mirin (ou vinho branco com uma pitada de açúcar)"], [2, "c. sopa", "açúcar e 1 c. sopa de sake ou água"], [null, "", "sementes de sésamo e cebolinho, para servir"]], "steps": ["Mistura soja, mirin, açúcar e sake — este é o teriyaki. Só isto.", "Frita o frango numa frigideira com um fio de óleo, pele para baixo primeiro, até dourar dos dois lados, 8 a 10 minutos.", "Tira o excesso de gordura com papel de cozinha, sem lavar a frigideira.", "Deita o molho e coze 3 a 4 minutos, virando o frango, até o molho engrossar e ficar brilhante como verniz.", "Fatia o frango, põe sobre o arroz e rega com o molho da frigideira. Sésamo e cebolinho por cima."], "pair": ["Arroz branco japonês (o par obrigatório)", "Brócolos ou edamame ao lado", "Salada de pepino com sésamo"], "tip": "O brilho vem de reduzir o molho na frigideira até colar no frango. Se deitares e tirares logo, fica só frango com soja."}, {"pt": "Onigiri", "en": "Onigiri — Japanese Rice Balls", "cats": ["japonesa", "arroz"], "day": "🇯🇵 Japonesa", "img": "https://cinnamonsnail.com/wp-content/uploads/2024/12/onigiri.jpg", "desc": "Bolinhos de arroz triangulares com recheio, embrulhados em alga. O lanche do Japão.", "prep": 20, "cook": 15, "total": 35, "diff": "Fácil", "serves": 4, "ings": [[300, "g", "arroz de sushi ou arroz curto"], [4, "folhas", "alga nori cortadas ao meio"], [100, "g", "recheio: atum com maionese, salmão desfiado ou ameixa umeboshi"], [null, "", "sal e água (para molhar as mãos)"]], "steps": ["Coze o arroz só com água (sem temperos) e deixa amornar tapado.", "Molha as mãos em água com sal — sem isto, o arroz cola-se todo a ti e não ao bolinho.", "Põe uma mão-cheia de arroz na palma, faz uma covinha, põe uma colher de recheio.", "Cobre com mais um pouco de arroz e aperta em forma de triângulo, virando entre as mãos, com firmeza mas sem esmagar.", "Embrulha a base com a tira de nori, como uma pega.", "Come nas horas seguintes — onigiri não gosta de frigorífico (o arroz endurece)."], "pair": ["Sopa miso", "Chá verde", "Numa caixa de lanche, como no Japão"], "tip": "Arroz quente demais queima as mãos e arroz frio não se molda. Morno é o ponto — como o das sandes, trabalha-se à temperatura do corpo."}, {"pt": "Okonomiyaki", "en": "Okonomiyaki — Japanese Savoury Pancake", "cats": ["japonesa", "vegetariano"], "day": "🇯🇵 Japonesa", "img": "https://frommypan.com/wp-content/uploads/2025/10/okonomiyaki-recipe-2.webp", "desc": "A 'pizza-panqueca' japonesa de couve: crocante por fora, macia por dentro, com molhos por cima.", "prep": 15, "cook": 15, "total": 30, "diff": "Fácil", "serves": 2, "ings": [[150, "g", "farinha e 150 ml de água ou caldo"], [2, "", "ovos"], [250, "g", "couve cortada muito fina"], [2, "", "cebolinhos em rodelas"], [null, "", "sal, óleo; para servir: maionese japonesa, molho okonomiyaki ou barbecue suave, flocos de bonito e alga (se tiveres)"]], "steps": ["Mistura farinha, água e ovos até ficar uma massa grossa. Tempera com sal.", "Junta a couve e o cebolinho e envolve — parece couve a mais, mas é mesmo assim (ela murcha na frigideira).", "Aquece óleo numa frigideira, deita a massa toda e achata num disco de 2 cm.", "Coze em lume médio-baixo 5 minutos, até a base dourar e firmar.", "Vira com a ajuda de um prato (com coragem!) e coze mais 4 a 5 minutos.", "Põe no prato e desenha os molhos por cima em zigue-zague — a apresentação clássica."], "pair": ["Sopa miso", "Salada de pepino", "Como prato único de jantar rápido"], "tip": "O nome significa 'grelhado como gostares': junta o que tiveres — bacon, camarão, queijo, milho. A base de couve aguenta tudo."}, {"pt": "Pizza caseira", "en": "Homemade Pizza", "cats": ["italiana", "massas"], "day": "🇮🇹 Italiana", "img": "https://i0.wp.com/www.cakeoncloud.com/wp-content/uploads/2025/04/pizza-margherita-8-scaled.jpg?fit=2560%2C1920&ssl=1", "desc": "Massa levedada em casa, molho simples e forno bem quente. Vê as fotos do processo no passo a passo.", "prep": 25, "cook": 15, "total": 40, "diff": "Médio", "serves": 4, "ings": [[300, "g", "farinha forte (ou normal)"], [1, "c. chá", "fermento de padeiro seco e outra de sal"], [200, "ml", "água morna"], [200, "g", "tomate triturado com sal e orégãos (molho)"], [200, "g", "mozzarella"], [null, "", "azeite, manjericão e os teus toppings (fiambre, cogumelos, pimento…)"]], "steps": ["Mistura farinha, fermento e sal. Junta a água morna e amassa 8 a 10 minutos, até ficar liso e elástico. (Foto 1: a amassar)", "Tapa e deixa levedar 1 hora, até dobrar de tamanho. (Foto 2: a massa levedada)", "Liga o forno no máximo (250°C) com o tabuleiro lá dentro a aquecer.", "Estende a massa numa superfície enfarinhada, do centro para fora, deixando uma borda mais alta. (Foto 3: a estender e a pôr o molho)", "Molho fino (molho a mais ensopa), mozzarella e toppings.", "Vai ao forno sobre o tabuleiro quente, 8 a 12 minutos, até a borda dourar e fazer bolhas. Manjericão no fim."], "pair": ["Salada verde com limão", "Como noite de cinema em casa", "Com a bruschetta da página italiana, de entrada"], "tip": "Forno caseiro nunca chega aos 450°C dos fornos de pizza — compensa com o tabuleiro pré-aquecido, que imita a pedra quente.", "fp": [["https://pizzaware.com/wp-content/uploads/2020/11/flour-for-pizza-1024x683.jpg", "Amassar: superfície enfarinhada e 8 a 10 minutos de mãos"], ["https://southsidekitchen.com/wp-content/uploads/2020/09/pizza-dough-8-550x413.jpg.webp", "Levedada: a massa dobrou de tamanho"], null, ["https://labuenareceta.arbweb.info/wp-content/uploads/2026/03/Screenshot-2026-03-02-215927-678x381-1.png", "Estender e espalhar o molho, fino"]]}, {"pt": "Gnocchi de batata com molho de tomate", "en": "Potato Gnocchi with Tomato Sauce", "cats": ["italiana", "massas", "vegetariano"], "day": "🇮🇹 Italiana", "img": "https://fleksa-cdn-v4.s3.eu-central-1.amazonaws.com/eb433a73-5c4a-4e01-bad2-ce550ef1eb5f/menu/items/1787615095200_ibfp1unuzcmcjdfrkfs6b", "desc": "Almofadinhas de batata que flutuam quando estão prontas. Mais fáceis do que parecem.", "prep": 30, "cook": 15, "total": 45, "diff": "Médio", "serves": 4, "ings": [[600, "g", "batatas farinhentas cozidas e bem escorridas"], [180, "g", "farinha (mais um pouco para a bancada)"], [1, "", "gema de ovo"], [400, "g", "tomate triturado, alho e manjericão (molho)"], [null, "", "sal, azeite e parmesão"]], "steps": ["Esmaga as batatas ainda quentes até ficarem um puré bem liso e seco. Deixa amornar.", "Junta a gema, sal e a farinha aos poucos, amassando só até ligar — massa trabalhada demais fica dura.", "Faz rolos da grossura de um dedo, corta pedacinhos de 2 cm e marca cada um com os dentes de um garfo.", "Coze em água a ferver com sal, em duas vezes: quando flutuarem, estão prontos (1 a 2 minutos).", "Entretanto aquece o molho de tomate com alho e azeite. Deita os gnocchi directamente no molho, com um pouco da água da cozedura.", "Serve com parmesão e manjericão."], "pair": ["Salada verde", "Como prato principal leve", "Com molho de manteiga e sálvia, na variação clássica"], "tip": "O truque é a batata seca: batata cozida com casca (ou assada) tem menos água e pede menos farinha — e menos farinha = gnocchi leves."}, {"pt": "Panna cotta", "en": "Panna Cotta", "cats": ["italiana", "sobremesas"], "day": "🇮🇹 Italiana", "img": "https://www.jacklinrecipes.com/wp-content/uploads/2026/01/jglitq0yq8vruek2fka6.webp", "desc": "O pudim italiano de natas que deve tremer quando o prato abana. Só 4 ingredientes.", "prep": 10, "cook": 5, "total": 15, "diff": "Fácil", "serves": 4, "ings": [[500, "ml", "natas"], [60, "g", "açúcar"], [1, "c. chá", "baunilha"], [2, "folhas", "gelatina (ou 1 c. chá de gelatina em pó)"], [null, "", "frutos vermelhos ou coulis, para servir"]], "steps": ["Põe a gelatina de molho em água fria 5 minutos.", "Aquece as natas com o açúcar e a baunilha até quase ferver — sem ferver.", "Tira do lume, junta a gelatina espremida e mexe até dissolver por completo.", "Deita em copinhos ou formas e leva ao frigorífico pelo menos 4 horas.", "Serve nos copos, com frutos por cima — desenformar é opcional e arriscado."], "pair": ["Frutos vermelhos frescos", "Coulis de maracujá (versão tropical)", "Um café expresso ao lado"], "tip": "O teste: a panna cotta certa treme como gelatina mole quando abanas o prato. Dura = gelatina a mais; mexe na dose, não na receita."}, {"pt": "Panquecas americanas", "en": "American Pancakes", "cats": ["americana", "vegetariano"], "day": "🇺🇸 Americana", "img": "http://www.24kitchen.nl/files/styles/content_header_medium/public/2019-12/american-pancaces.webp?itok=EOO9xG-d", "desc": "Altas, fofas e douradas, em torre com manteiga e xarope. O pequeno-almoço dos filmes.", "prep": 10, "cook": 15, "total": 25, "diff": "Fácil", "serves": 4, "ings": [[250, "g", "farinha"], [2, "c. sopa", "açúcar"], [2, "c. chá", "fermento"], [300, "ml", "leite"], [2, "", "ovos"], [40, "g", "manteiga derretida"], [null, "", "uma pitada de sal; xarope de ácer (maple) ou mel, para servir"]], "steps": ["Mistura os secos numa tigela grande.", "Bate leite, ovos e manteiga e deita sobre os secos. Mexe só até ligar — grumos pequenos são bons, massa batida demais faz panquecas borracha.", "Deixa a massa repousar 5 minutos.", "Frigideira antiaderente em lume médio, levemente untada. Uma concha pequena de massa por panqueca.", "Quando aparecerem bolhas à superfície (2 minutos), vira e coze mais 1 minuto.", "Empilha, manteiga por cima e xarope a escorrer."], "pair": ["Frutos vermelhos e iogurte", "Banana às rodelas e mel", "Bacon crocante ao lado (o contraste salgado-doce americano)"], "tip": "Nunca apertes a panqueca com a espátula depois de virar — sai o ar todo e ela baixa."}, {"pt": "Pão de milho", "en": "Cornbread", "cats": ["americana", "bolos"], "day": "🇺🇸 Americana", "img": "https://www.recipesbylaurel.com/wp-content/uploads/2025/11/cysbnhvekvfurxfccslj.webp", "desc": "Pão rápido de farinha de milho, dourado e um bocadinho doce, assado na frigideira de ferro ou numa forma.", "prep": 10, "cook": 25, "total": 35, "diff": "Fácil", "serves": 6, "ings": [[200, "g", "farinha de milho fina (fubá)"], [120, "g", "farinha de trigo"], [2, "c. sopa", "açúcar"], [1, "c. sopa", "fermento"], [250, "ml", "leite"], [2, "", "ovos e 60 g de manteiga derretida"]], "steps": ["Forno a 200°C, com a forma ou frigideira lá dentro a aquecer — forma quente faz a crosta.", "Mistura os secos. Bate leite, ovos e manteiga e junta, mexendo só até ligar.", "Deita a massa na forma quente untada (vai chiar — é bom sinal).", "Assa 20 a 25 minutos, até dourar e o palito sair limpo.", "Arrefece 10 minutos e corta em fatias grossas."], "pair": ["Com feijoada ou feijão tropeiro — experimenta!", "Com as costelinhas barbecue", "Manteiga e mel por cima, ainda morno"], "tip": "Não é pão de levedar: é um bolo-pão de fermento químico. Misturou, forno — sem esperas."}, {"pt": "Asas de frango picantes", "en": "Buffalo-Style Chicken Wings", "cats": ["americana", "carne"], "day": "🇺🇸 Americana", "img": "https://www.yucatanindependiente.com/wp-content/uploads/2020/04/receta-facil-de-alitas-de-pollo-con-cerveza-1024x836.jpg", "desc": "Asinhas crocantes do forno banhadas em molho picante de manteiga. Para comer com as mãos e guardanapos.", "prep": 10, "cook": 35, "total": 45, "diff": "Fácil", "serves": 4, "ings": [[1000, "g", "asas de frango cortadas nas juntas"], [1, "c. sopa", "fermento em pó (o truque da crocância no forno)"], [100, "ml", "molho picante (tipo Frank's ou piri-piri suave)"], [50, "g", "manteiga derretida"], [null, "", "sal, alho em pó; palitos de cenoura e aipo e molho de iogurte ou queijo azul, para servir"]], "steps": ["Seca muito bem as asas com papel de cozinha. Mistura com sal, alho em pó e o fermento.", "Põe numa grelha sobre um tabuleiro e assa a 220°C por 30 a 35 minutos, virando a meio, até ficarem bem crocantes.", "Mistura o molho picante com a manteiga derretida.", "Deita as asas numa tigela grande, rega com o molho e sacode para cobrir todas.", "Serve logo, com os palitos de legumes e o molho branco ao lado."], "pair": ["Batatas fritas", "Salada coleslaw", "Cerveja ou limonada bem fria"], "tip": "O fermento em pó na pele muda o pH e faz crocância de fritura no forno. Não é erro de receita — é ciência, e resulta."}];

let favs=new Set(JSON.parse(localStorage.getItem("livroReceitasFavs")||"[]"));
function saveFavs(){localStorage.setItem("livroReceitasFavs",JSON.stringify([...favs]))}
function fmtQty(q,base,serv){ if(q===null||q===undefined) return ""; let v=q/base*serv; v=Math.round(v*4)/4; let s=(v%1===0.5)?(Math.floor(v)+",5"):(v%1===0.25)?(Math.floor(v)+",25"):(v%1===0.75)?(Math.floor(v)+",75"):(String(v)); if(v<1&&v>0) s=String(v).replace(".",","); return s+" "; }
function matches(r){ if(!query) return true; let q=query.toLowerCase(); return (r.pt+" "+r.en+" "+r.cats.map(c=>CATNAME[c]).join(" ")).toLowerCase().includes(q); }
function cardHTML(r){ let idx=RECIPES.indexOf(r); return `<div class="card" onclick="openRecipe(${idx})"><div class="imgwrap"><img loading="lazy" src="${r.img}" alt="${r.pt}"><button class="fav" onclick="event.stopPropagation();toggleFav(${idx},this)">${favs.has(idx)?"❤️":"🤍"}</button></div><div class="body"><h3>${r.pt}</h3><div class="en">${r.en}</div><div class="desc">${r.desc}</div><div class="meta"><span class="chip">⏱️ ${r.total} min</span><span class="chip">${r.diff}</span><span class="chip day">${r.day}</span><span class="chip cat">${CATNAME[r.cats[0]]}</span></div></div></div>`; }
function grid(list){ return list.length?`<div class="grid">${list.map(cardHTML).join("")}</div>`:`<div class="empty">Nada por aqui ainda. 🍽️</div>`; }

/* ESCOLA */
function escolaHTML(){ return `<h2 class="sec"><span class="script">aprende</span>Escola de Cozinha</h2><p class="lead">Quatro aulas curtas e directas: as técnicas que fazem diferença, como medir sem errar, como empratar bonito com porções normais — e as coberturas de chocolate, com receita completa.</p>
<div class="panel"><h3>🔑 1 · Técnicas que mudam tudo</h3><ul>
<li><b>Mise en place:</b> antes de acender o lume, corta, mede e arruma tudo em tigelas. Cozinhar deixa de ser uma corrida e passa a ser uma sequência calma.</li>
<li><b>Dourar é sabor:</b> frigideira bem quente, comida seca (papel de cozinha!) e sem amontoar — peças coladas cozem a vapor e ficam cinzentas. Doura em duas vezes, se for preciso.</li>
<li><b>Sal em camadas:</b> um pouco em cada fase, e prova no fim. Sal só no fim sabe a 'por cima'; sal durante sabe a 'dentro'.</li>
<li><b>Repouso:</b> carnes descansam 5–10 minutos (os sumos voltam para dentro); bolos descansam antes de desenformar e arrefecem antes de cobrir. Pressa aqui estraga o trabalho todo.</li>
<li><b>Prova e acerta:</b> quase todos os pratos pedem um acerto final — um fio de limão ou vinagre acorda molhos gordos, uma pitada de açúcar acalma tomate ácido, sal realça o chocolate.</li>
<li><b>Lume é ingrediente:</b> refogados e molhos pedem lume brando e tempo; grelhados e salteados pedem lume forte e rapidez. Trocar os dois é o erro mais comum de todos.</li></ul></div>
<div class="panel"><h3>🍞 2 · Massas levedadas, sem medo</h3><img class="wide" src="${KNEAD}" alt="A amassar massa com farinha"><p>Para pães, pizza e naan, o básico é sempre o mesmo:</p><ul>
<li><b>Água morna, nunca quente</b> (quente mata o fermento; fria só o atrasa).</li>
<li><b>Amassa 8–10 minutos</b> até a massa ficar lisa e elástica: estica um pedacinho — deve abrir fino sem rasgar logo (o 'teste da janela').</li>
<li><b>Levedar = dobrar de tamanho</b>, em sítio sem correntes de ar, tigela tapada. Marca 1 hora, mas confia no tamanho, não no relógio.</li>
<li><b>Massa pegajosa resolve-se com tempo, não com farinha:</b> 5 minutos de descanso e ela descola-se das mãos. Farinha a mais = pão duro.</li></ul></div>
<div class="panel"><h3>⚖️ 3 · Medir bem (a aula que salva bolos)</h3><p>Bolinhos e bolos falham mais por medidas erradas do que por falta de jeito. A balança é a tua melhor amiga — mas se medires em chávenas, usa esta tabela (chávena de 240 ml):</p>
<table class="med"><tr><th>Ingrediente</th><th>1 chávena</th><th>1 c. sopa</th></tr>
<tr><td>Farinha de trigo</td><td>125 g</td><td>8 g</td></tr>
<tr><td>Açúcar</td><td>200 g</td><td>12 g</td></tr>
<tr><td>Açúcar mascavado</td><td>220 g</td><td>14 g</td></tr>
<tr><td>Manteiga</td><td>230 g</td><td>14 g</td></tr>
<tr><td>Cacau em pó</td><td>100 g</td><td>6 g</td></tr>
<tr><td>Leite / água</td><td>240 ml</td><td>15 ml</td></tr>
<tr><td>Arroz (cru)</td><td>185 g</td><td>—</td></tr></table>
<ul><li><b>Farinha mede-se à colher:</b> enche a chávena com uma colher e nivela com uma faca. Mergulhar a chávena no saco compacta e mete até +30% — bolo pesado garantido.</li>
<li><b>Colheres:</b> sopa = 15 ml · chá = 5 ml · café = 2,5 ml. 'Uma pitada' é o que apanhares entre dois dedos.</li>
<li><b>Forno:</b> 160°C = brando (bolos delicados) · 180°C = médio (a maioria dos bolos) · 200°C = quente (assados, pizza caseira) · 220–250°C = muito quente (pizza, pão, gratinar).</li>
<li><b>Ovos:</b> as receitas deste livro usam ovos médios/grandes à temperatura ambiente para bolos (batem melhor e não talham as massas).</li></ul></div>
<div class="panel"><h3>🎨 4 · Empratar bonito (com porções normais)</h3><img class="wide" src="${PLATE}" alt="Empratamento cuidado"><p>Empratar não é arte de restaurante caro — é arrumação com intenção. As regras que funcionam em casa:</p><ul>
<li><b>Porções normais primeiro:</b> proteína do tamanho da palma da mão (120–150 g), hidratos do tamanho do punho fechado, e legumes a ocupar metade do prato. Bonito e equilibrado nascem juntos.</li>
<li><b>Prato maior que a comida:</b> deixa sempre uma borda livre de 3–4 cm. Comida encostada à borda parece sempre apressada.</li>
<li><b>Altura, não largura:</b> empilha com delicadeza (o arroz moldado com uma chávena, a massa enrolada com um garfo) em vez de espalhares tudo plano.</li>
<li><b>Números ímpares:</b> 3 ou 5 elementos (camarões, fatias, bolinhos) lêem-se melhor do que 2 ou 4. Os olhos gostam de ímpares.</li>
<li><b>O molho vai com intenção:</b> uma risca ou uma 'colherada arrastada' por baixo/ao lado da proteína — nunca uma poça por cima de tudo, que esconde o trabalho.</li>
<li><b>Cor e contraste:</b> um prato todo bege pede ajuda — ervas frescas picadas, um legume verde ou rodelas de limão mudam tudo.</li>
<li><b>Limpa a borda:</b> passa um papel de cozinha limpo à volta do prato antes de servir. Dez segundos, efeito restaurante.</li></ul></div>
<div class="panel"><h3>🍫 5 · Coberturas de chocolate — as três que precisas</h3>
<div class="mini"><h4>a) Cobertura cremosa de chocolate (a clássica, de espalhar)</h4><p><b>Vais precisar:</b> 200 g de manteiga à temperatura ambiente · 300 g de açúcar em pó · 50 g de cacau · 3–4 c. sopa de leite · 1 c. chá de baunilha · pitada de sal.</p><p><b>Como fazer:</b> bate a manteiga 2 minutos até clarear. Junta açúcar e cacau peneirados, o leite, a baunilha e o sal. Bate devagar primeiro (senão voa tudo), depois 2 minutos depressa até ficar leve e de espalhar. Grossa demais? +1 colher de leite. Mole demais? +2 colheres de açúcar em pó. <b>Usa em:</b> o Bolo de chocolate deste livro, cupcakes, bolo urso.</p></div>
<div class="mini"><h4>b) Ganache brilhante (a de escorrer pelas bordas)</h4><p><b>Vais precisar:</b> 200 g de chocolate negro · 200 ml de natas. (Proporção 1:1 = molho que firma macio. Para firmar mais, tipo trufa: 2:1.)</p><p><b>Como fazer:</b> aquece as natas até quase ferver. Deita sobre o chocolate picado, espera 2 minutos sem mexer, e depois mexe do centro para fora até ficar um creme liso e brilhante. Morno, escorre; frio e batido, vira cobertura fofa. <b>Usa em:</b> bolos de festa, profiteroles, morangos.</p></div>
<div class="mini"><h4>c) Cobertura de brigadeiro mole (a do bolo de cenoura)</h4><p><b>Vais precisar:</b> 1 lata de leite condensado · 3 c. sopa de cacau · 1 c. sopa de manteiga · 3 c. sopa de leite.</p><p><b>Como fazer:</b> tudo numa panela, lume médio-baixo, sempre a mexer, 6–8 minutos, até engrossar e começar a ver-se o fundo ao passar a colher. Deita quente sobre o bolo morno. <b>Usa em:</b> bolo de cenoura, bolo de chocolate rápido, como molho de gelado.</p></div>
<p>Regra de ouro das três: <b>bolo frio, sempre.</b> Cobertura sobre bolo morno derrete, escorre e desaparece dentro da massa.</p></div>`; }

let equipSet=new Set(JSON.parse(localStorage.getItem("livroEquip")||"[]"));
function equipHTML(){ return `<h2 class="sec"><span class="script">a tua</span>Equipamento — o que ter em casa</h2><p class="lead">Não precisas de uma cozinha de chef: precisas disto, que chega para todas as receitas do livro. Marca o que já tens — a lista guarda-se neste aparelho.</p><div class="panel"><img class="wide" src="${EQIMG}" alt="Equipamento de cozinha e pastelaria"><div id="eqList"></div></div>`; }
function drawEquip(){ let host=document.getElementById("eqList"); if(!host) return; host.innerHTML=EQUIP.map((e,i)=>{ if(e[1]==="") return `<h3 style="margin-top:18px">${e[0]}</h3>`; let id="eq"+i; return `<label class="eqitem ${equipSet.has(id)?"done":""}"><input type="checkbox" ${equipSet.has(id)?"checked":""} onchange="toggleEquip('${id}',this)"><span><span class="nm">${e[0]} ${e[1]}</span><br><span class="ds">${e[2]}</span></span></label>`; }).join(""); }

function notasHTML(){ return `<h2 class="sec"><span class="script">o teu</span>caderno de cozinha</h2><p class="lead">Anota o que correu bem, o que mudaste e o que queres repetir. As notas ficam guardadas neste aparelho, só para ti.</p><div class="noteform"><input id="noteTitle" placeholder="Título (ex.: Bolo de chocolate — o que mudei)"><textarea id="noteText" placeholder="Escreve aqui a tua nota… (ex.: usei metade do açúcar e ficou perfeito; da próxima, mais 5 minutos de forno)"></textarea><button class="bigbtn" style="margin-top:2px" onclick="addNote()">💾 Guardar nota</button></div><div id="noteList"></div>`; }
function getNotes(){ return JSON.parse(localStorage.getItem("livroNotas")||"[]"); }
function drawNotes(){ let host=document.getElementById("noteList"); if(!host) return; let ns=getNotes(); host.innerHTML=ns.length?ns.map((n,i)=>`<div class="notecard"><div class="t">${n.t||"Sem título"}</div><div class="d">${n.d}</div><div class="x">${n.x}</div><button onclick="delNote(${i})">🗑️ Apagar esta nota</button></div>`).join(""):`<div class="empty">Ainda não há notas. A primeira sai já na próxima receita. ✍️</div>`; }
function addNote(){ let t=document.getElementById("noteTitle").value.trim(); let x=document.getElementById("noteText").value.trim(); if(!x){ alert("Escreve qualquer coisa na nota primeiro. 🙂"); return; } let ns=getNotes(); ns.unshift({t:t,x:x,d:new Date().toLocaleDateString("pt-PT",{day:"numeric",month:"long",year:"numeric"})}); localStorage.setItem("livroNotas",JSON.stringify(ns)); drawNotes(); }
function delNote(i){ let ns=getNotes(); ns.splice(i,1); localStorage.setItem("livroNotas",JSON.stringify(ns)); drawNotes(); }
