<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Na Cozinha com a Lili — O Meu Livro de Receitas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Great+Vibes&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ivory:#FAF6EF;--paper:#fff;--sand:#F3EDE0;--line:#E6DCC4;--ink:#33302A;--muted:#8A7D63;--terra:#C4552D;--gold:#B08D3C;--sage:#DDE8D2}
*{box-sizing:border-box} html{color-scheme:light}
body{margin:0;background:var(--ivory);font-family:'Jost','Avenir Next','Segoe UI',sans-serif;color:var(--ink)}
.wrap{max-width:1120px;margin:0 auto;padding:0 14px 60px}
@media(min-width:760px){.wrap{padding:0 26px}}
.serif{font-family:'Playfair Display',Georgia,serif}
.script{font-family:'Great Vibes','Snell Roundhand',cursive;color:var(--terra);font-weight:400}
/* COVER */
.cover{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px;text-align:center}
.cover .collage{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.cover .collage img{width:100%;height:clamp(110px,26vw,240px);object-fit:cover;display:block}
.cover .inner{padding:22px 20px 26px}
.cover .pre{font-size:clamp(24px,5vw,34px);line-height:1}
.cover h1{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:clamp(30px,6.4vw,52px);margin:2px 0 4px;letter-spacing:.2px}
.cover .en{font-style:italic;color:var(--muted);font-size:clamp(14px,2.8vw,18px);font-family:'Playfair Display',Georgia,serif}
.cover p.intro{max-width:660px;margin:14px auto 0;font-size:15.5px;line-height:1.65;color:#55483E}
.cover .by{margin-top:12px;color:var(--gold);font-weight:600;letter-spacing:2px;text-transform:uppercase;font-size:12.5px}
.heroBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.hbtn{background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;cursor:pointer;font-weight:600;font-family:inherit}
.hbtn.main{background:var(--terra);border-color:var(--terra);color:#fff}
/* TABS */
nav.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.tab{flex:1 1 auto;text-align:center;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:inherit;letter-spacing:.3px}
.tab.on{background:var(--terra);border-color:var(--terra);color:#fff}
.search{width:100%;padding:13px 18px;border-radius:999px;border:1.5px solid var(--line);font-size:15px;background:#fff;margin:2px 0 16px;font-family:inherit}
/* CARDS */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:10px}.card .body{padding:10px}.card h3{font-size:14.5px}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(90,70,30,.05)}
.card img{width:100%;height:170px;object-fit:cover;display:block}
.card .body{padding:13px 14px 15px;flex:1;display:flex;flex-direction:column}
.card h3{margin:0;font-size:16.5px;line-height:1.3;font-family:'Playfair Display',Georgia,serif;font-weight:700}
.card .en{color:var(--muted);font-style:italic;font-size:12.5px;margin:3px 0 8px}
.card .desc{font-size:13.5px;color:#55483E;line-height:1.5;flex:1}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--sand);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.chip.day{background:rgba(196,85,45,.12);color:#9A3E1E}
.chip.cat{background:var(--sage);color:#44552F}
.fav{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.94);border:none;border-radius:50%;width:38px;height:38px;font-size:19px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.imgwrap{position:relative}
h2.sec{font-family:'Playfair Display',Georgia,serif;font-weight:800;color:var(--ink);font-size:23px;margin:24px 0 4px}
h2.sec .script{font-size:26px;margin-right:6px}
p.lead{color:#55483E;line-height:1.6;margin:0 0 14px;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0 6px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 12px;text-align:center;cursor:pointer}
.tile:hover{border-color:var(--gold)}
.tile .ico{font-size:32px}.tile .t{font-weight:700;margin-top:6px;font-family:'Playfair Display',Georgia,serif;font-size:16px}.tile .n{color:var(--muted);font-size:12.5px}
.daycard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.daycard h3{margin:0 0 10px;font-family:'Playfair Display',Georgia,serif}
.dayrow{display:flex;gap:12px;align-items:center;padding:9px 6px;border-radius:12px;cursor:pointer}
.dayrow:hover{background:var(--ivory)}
.dayrow img{width:64px;height:52px;object-fit:cover;border-radius:10px}
.dayrow .pt{font-weight:700;font-size:15px}.dayrow .en{font-size:12.5px;color:var(--muted);font-style:italic}
/* RECIPE */
#recipeView{display:none;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}
#recipeView img.hero{width:100%;max-height:420px;object-fit:cover;display:block}
.rbody{padding:18px 20px 26px}
.rbody h2{font-family:'Playfair Display',Georgia,serif;font-weight:800;margin:0;font-size:clamp(23px,4.6vw,32px)}
.rbody .en{font-style:italic;color:var(--muted);font-size:16px;margin:4px 0 10px;font-family:'Playfair Display',Georgia,serif}
.rmeta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.rsec{font-family:'Playfair Display',Georgia,serif;font-weight:700;color:var(--ink);font-size:20px;margin:26px 0 10px;border-bottom:2px solid var(--sand);padding-bottom:6px}
.serves{display:inline-flex;align-items:center;gap:10px;background:var(--sand);border-radius:999px;padding:5px 8px;font-weight:700}
.serves button{width:32px;height:32px;border-radius:50%;border:none;background:var(--terra);color:#fff;font-size:18px;cursor:pointer}
ul.ings{list-style:none;margin:12px 0 0;padding:0}
ul.ings li{padding:9px 10px;border-bottom:1px solid #F0E8D8;display:flex;gap:10px;align-items:flex-start;font-size:15.5px;line-height:1.4;cursor:pointer}
ul.ings li.done{opacity:.45;text-decoration:line-through}
ul.ings input{width:20px;height:20px;accent-color:var(--terra);flex:none;margin-top:1px}
ol.steps{margin:0;padding-left:22px}
ol.steps li{font-size:15.5px;line-height:1.55;margin-bottom:10px}
.pairs{display:flex;gap:8px;flex-wrap:wrap}
.pair{background:var(--sand);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600}
.tip{background:#FDF6E9;border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.6;margin-top:8px}
.bigbtn{display:block;width:100%;background:var(--terra);color:#fff;border:none;border-radius:14px;padding:15px;font-size:16.5px;font-weight:700;cursor:pointer;margin-top:22px;font-family:inherit;letter-spacing:.3px}
.ghostbtn{background:#fff;border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.backrow{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.fpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.fpgrid figure{margin:0}.fpgrid img{width:100%;height:160px;object-fit:cover;border-radius:12px;display:block}
.fpgrid figcaption{font-size:13px;color:#55483E;margin-top:6px;line-height:1.45}
/* LEARN PAGES */
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.panel h3{font-family:'Playfair Display',Georgia,serif;margin:0 0 8px;font-size:20px}
.panel p,.panel li{font-size:15px;line-height:1.65;color:#453A30}
.panel ul,.panel ol{margin:6px 0;padding-left:21px}.panel li{margin-bottom:6px}
.panel img.wide{width:100%;max-height:320px;object-fit:cover;border-radius:12px;display:block;margin:10px 0}
table.med{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0}
table.med th,table.med td{border-bottom:1px solid #F0E8D8;padding:8px 6px;text-align:left}
table.med th{color:var(--gold);letter-spacing:.5px;font-size:13px;text-transform:uppercase}
.mini{background:var(--ivory);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:10px 0}
.mini h4{margin:0 0 6px;font-family:'Playfair Display',Georgia,serif;font-size:17px}
.eqitem{display:flex;gap:11px;align-items:flex-start;padding:10px 6px;border-bottom:1px solid #F0E8D8;cursor:pointer}
.eqitem input{width:21px;height:21px;accent-color:var(--terra);margin-top:2px}
.eqitem .nm{font-weight:700}.eqitem .ds{color:#55483E;font-size:14px;line-height:1.45}
.eqitem.done .nm{text-decoration:line-through;opacity:.55}
/* NOTES */
.noteform{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.noteform input,.noteform textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;font-family:inherit;margin-bottom:10px;background:var(--ivory)}
.noteform textarea{min-height:110px;resize:vertical}
.notecard{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:13px 15px;margin-bottom:10px}
.notecard .t{font-weight:700;font-family:'Playfair Display',Georgia,serif;font-size:16.5px}
.notecard .d{color:var(--muted);font-size:12.5px;margin:2px 0 6px}
.notecard .x{white-space:pre-wrap;font-size:14.5px;line-height:1.55;color:#453A30}
.notecard button{background:none;border:none;color:var(--terra);font-weight:700;cursor:pointer;padding:6px 0 0;font-family:inherit}
/* GUIDE */
#guide{display:none;position:fixed;inset:0;background:var(--ivory);z-index:100;overflow-y:auto;padding:20px 16px 40px}
#guide .inner{max-width:680px;margin:0 auto}
#guide .prog{height:10px;background:#EADFC8;border-radius:99px;overflow:hidden;margin:14px 0 20px}
#guide .bar{height:100%;background:var(--terra);width:0%}
#guide .stepnum{color:var(--terra);font-weight:700;font-size:14px;letter-spacing:1.2px;text-transform:uppercase}
#guide .steptext{font-size:clamp(20px,4.6vw,27px);line-height:1.5;font-family:'Playfair Display',Georgia,serif;font-weight:600;margin:10px 0 24px}
#guide img.step{width:100%;max-height:300px;object-fit:cover;border-radius:14px;display:block;margin:0 0 18px}
.gnav{display:flex;gap:10px}
.gnav button{flex:1;padding:15px;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.gprev{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.gnext{background:var(--terra);border:none;color:#fff}
.empty{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:13px;line-height:1.6;margin-top:34px;text-align:center}
</style></head><body><div class="wrap">

secos e as amêndoas.", "Junta o sumo de limão e as ervas picadas. Prova e acerta o sal.", "Serve morno — fica ótimo acabado de fazer e no dia a seguir."], "pair": ["Frango grelhado ao lado", "Salmão no forno", "Salada de tomate", "Molho de iogurte com hortelã"], "tip": "Não cozas o couscous como massa. É só hidratar com caldo quente, tapado — senão fica papa."}, {"pt": "Caldo verde", "en": "Portuguese Kale Soup", "cats": ["sopas"], "day": "3ª feira", "img": "https://www.luismiguelcosta.pt/wp-content/uploads/2023/11/caldo-verde-23-682x1024.jpg", "desc": "O clássico português: creme de batata com couve bem fininha e um fio de azeite.", "prep": 10, "cook": 25, "total": 35, "diff": "Fácil", "serves": 4, "ings": [[500, "g", "batatas em cubos"], [1, "", "cebola"], [2, "dentes", "alho"], [200, "g", "couve galega cortada muito fina (ou kale)"], [1200, "ml", "água"], [4, "rodelas", "chouriço (se quiseres)"], [null, "", "azeite e sal"]], "steps": ["Coze as batatas, a cebola e o alho em água com sal por 20 minutos.", "Tritura tudo até ficar um creme liso. Se estiver muito grosso, junta mais um pouco de água quente.", "Volta a pôr ao lume. Quando ferver, junta a couve bem fininha.", "Coze só 5 a 7 minutos — a couve deve ficar verde viva e macia, não castanha.", "Junta um bom fio de azeite e acerta o sal.", "Serve bem quente, com uma rodela de chouriço por cima de cada tigela."], "pair": ["Broa de milho", "Pão caseiro para molhar na sopa", "Um fio de azeite bom por cima"], "tip": "Corta a couve o mais fina que conseguires. E não a cozas demais: perde a cor e o sabor."}, {"pt": "Filetes de pescada com salada russa", "en": "Hake Fillets with Russian Salad", "cats": ["peixe"], "day": "3ª feira", "img": "https://mariapaparica.pt/wp-content/uploads/2022/04/Filetes-de-pescada-panados-com-salada-russa.jpg", "desc": "Peixe panado e dourado com aquela salada cremosa de batata, cenoura e ervilhas.", "prep": 20, "cook": 15, "total": 35, "diff": "Médio", "serves": 4, "ings": [[4, "", "filetes de pescada"], [100, "g", "farinha"], [1, "", "ovo batido"], [100, "g", "pão ralado"], [3, "", "batatas em cubos"], [2, "", "cenouras em cubos"], [150, "g", "ervilhas"], [3, "c. sopa", "maionese"], [0.5, "", "limão"], [null, "", "azeite, sal e pimenta"]], "steps": ["Coze a batata, a cenoura e as ervilhas em água com sal. Escorre e deixa arrefecer.", "Mistura os legumes com a maionese, umas gotas de limão e pimenta. Guarda no frigorífico.", "Tempera os filetes com sal, pimenta e limão. Passa cada um por farinha, ovo e pão ralado.", "Aquece azeite numa frigideira e frita 3 a 4 minutos de cada lado, até dourarem. (No forno: 200°C, 15 minutos.)", "Põe os filetes sobre papel de cozinha um minuto, para sair o azeite a mais.", "Serve com a salada russa bem fresquinha e rodelas de limão."], "pair": ["Salada verde", "Arroz branco soltinho", "Batatas no forno em vez de fritas"], "tip": "Salada russa feita de véspera fica ainda melhor — os sabores misturam-se no frigorífico."}, {"pt": "Penne sem glúten com legumes e amêndoa", "en": "Gluten-Free Penne with Vegetables & Almond", "cats": ["massas", "vegetariano"], "day": "3ª feira", "img": "https://app.wellable.co/NutritionImages/Recipes/1356/detail-mobile.jpg", "desc": "Massa rápida com legumes salteados e amêndoa tostada crocante por cima.", "prep": 10, "cook": 15, "total": 25, "diff": "Fácil", "serves": 4, "ings": [[320, "g", "penne sem glúten"], [1, "", "curgete em meias-luas"], [1, "", "pimento em tiras"], [150, "g", "tomate cereja cortado ao meio"], [2, "dentes", "alho laminado"], [40, "g", "amêndoa laminada"], [null, "", "azeite, sal, pimenta e manjericão"], [null, "", "queijo parmesão ralado (se quiseres)"]], "steps": ["Coze a massa em água bem salgada, pelo tempo da embalagem. Guarda uma chávena da água da cozedura.", "Numa frigideira seca, tosta a amêndoa 2 minutos até cheirar bem. Tira e guarda.", "Na mesma frigideira, salteia o alho e os legumes em azeite 6 a 7 minutos. O tomate entra no fim.", "Junta a massa escorrida e um pouco da água da cozedura. Mexe bem, 1 minuto.", "Desliga o lume. Junta o manjericão e o parmesão.", "Serve com a amêndoa tostada por cima — é ela que dá o crocante."], "pair": ["Salada de rúcula", "Frango grelhado ao lado", "Queijo feta esfarelado por cima"], "tip": "A água da cozedura tem amido e liga a massa aos legumes. Não a deites fora!"}, {"pt": "Creme de legumes", "en": "Vegetable Cream Soup", "cats": ["sopas"], "day": "4ª feira", "img": "https://static.itdg.com.br/images/auto-auto/2f6e7a3a0bd89a90e5cffeff8150e923/shutterstock-553985692.jpg", "desc": "A sopa de todos os dias: simples, leve e ótima para aproveitar os legumes que há em casa.", "prep": 10, "cook": 25, "total": 35, "diff": "Fácil", "serves": 4, "ings": [[2, "", "batatas"], [2, "", "cenouras"], [1, "", "curgete"], [1, "", "cebola"], [1, "", "alho-francês"], [2, "dentes", "alho"], [900, "ml", "caldo ou água quente"], [null, "", "azeite, sal e pimenta"]], "steps": ["Corta todos os legumes em pedaços mais ou menos do mesmo tamanho.", "Refoga a cebola, o alho-francês e o alho em azeite por 3 minutos.", "Junta os outros legumes e o caldo. Coze 20 minutos, até ficar tudo macio.", "Tritura até ficar um creme liso. Junta água quente se estiver grosso demais.", "Prova, acerta o sal, e serve com um fio de azeite."], "pair": ["Pão torrado", "Croutons", "Ovo cozido picado por cima"], "tip": "Esta é a receita-base. Troca os legumes pelo que tiveres: abóbora, batata-doce, brócolos — resulta sempre."}, {"pt": "Lasanha bolonhesa", "en": "Lasagna Bolognese", "cats": ["massas"], "day": "4ª feira", "img": "https://static.itdg.com.br/images/640-400/a9785927200dab579e1144c4afa6f6c8/lasanha.png", "desc": "Camadas de massa, carne com tomate e béchamel, com queijo dourado por cima.", "prep": 25, "cook": 45, "total": 70, "diff": "Médio", "serves": 4, "ings": [[12, "folhas", "massa de lasanha"], [500, "g", "carne picada de vaca"], [1, "", "cebola picada"], [2, "dentes", "alho picado"], [400, "g", "tomate triturado"], [2, "c. sopa", "polpa de tomate"], [500, "ml", "béchamel (de compra ou caseiro)"], [100, "g", "queijo ralado"], [null, "", "azeite, sal, pimenta, orégãos e noz-moscada"]], "steps": ["Refoga a cebola e o alho em azeite. Junta a carne e deixa dourar bem, mexendo para soltar.", "Junta o tomate, a polpa, os orégãos, sal e pimenta. Coze em lume brando 15 minutos.", "Se fizeres o béchamel em casa: derrete 50 g de manteiga, junta 50 g de farinha, e depois 500 ml de leite aos poucos, sempre a mexer até engrossar. Tempera com sal e noz-moscada.", "Num tabuleiro, monta por camadas: um pouco de béchamel, folhas de massa, carne, béchamel. Repete 3 vezes.", "Termina com béchamel e o queijo ralado por cima de tudo.", "Forno a 180°C por 30 minutos, até dourar e borbulhar. Deixa repousar 10 minutos antes de cortar — corta muito melhor."], "pair": ["Salada verde bem simples", "Pão de alho", "Legumes grelhados ao lado"], "tip": "O repouso no fim não é opcional: é ele que faz as fatias saírem direitinhas em vez de desmancharem."}, {"pt": "Hambúrguer de lentilhas com tomate assado", "en": "Lentil Burger with Roasted Tomato", "cats": ["vegetariano"], "day": "4ª feira", "img": "https://www.plantte.com/wp-content/uploads/2020/10/hamburguer-de-lentilha.jpg", "desc": "Hambúrguer sem carne, com sabor e textura — e um tomate assado docinho a acompanhar.", "prep": 15, "cook": 20, "total": 35, "diff": "Médio", "serves": 4, "ings": [[250, "g", "lentilhas já cozidas e bem escorridas"], [1, "", "cebola bem picada"], [2, "dentes", "alho picado"], [80, "g", "pão ralado ou flocos de aveia"], [1, "", "ovo"], [1, "c. chá", "cominhos"], [1, "c. chá", "paprica"], [2, "", "tomates em fatias grossas"], [4, "", "pães de hambúrguer"], [null, "", "azeite, sal, pimenta, coentros e folhas de alface"]], "steps": ["Forno a 200°C. Põe as fatias de tomate num tabuleiro com azeite, sal e orégãos e assa 15 minutos.", "Esmaga as lentilhas com um garfo — deixa alguns pedaços, não faças puré.", "Mistura a cebola, o alho, o ovo, o pão ralado, os cominhos, a paprica, sal e coentros.", "Molda 4 hambúrgueres. Se tiveres tempo, 15 minutos no frigorífico ajuda a firmarem.", "Grelha ou frita em azeite, 4 a 5 minutos de cada lado, até ficarem dourados.", "Monta o pão com alface, o hambúrguer e o tomate assado por cima."], "pair": ["Batata-doce no forno", "Salada fresca", "Molho de iogurte com limão e alho", "No prato, sem pão, com arroz ao lado"], "tip": "As lentilhas têm de estar bem escorridas. Se estiverem molhadas, o hambúrguer desmancha-se na frigideira."}, {"pt": "Creme de ervilhas", "en": "Pea Cream Soup", "cats": ["sopas"], "day": "5ª feira", "img": "https://amodadoflavio.pt/wp-content/uploads/2018/06/sopa-ervilhas.jpg", "desc": "Verde, rápido e fresquinho — com hortelã fica ainda melhor.", "prep": 5, "cook": 20, "total": 25, "diff": "Fácil", "serves": 4, "ings": [[500, "g", "ervilhas congeladas"], [1, "", "cebola"], [1, "", "batata pequena em cubos"], [2, "dentes", "alho"], [800, "ml", "caldo ou água quente"], [6, "folhas", "hortelã"], [null, "", "azeite, sal e umas colheradas de natas (se quiseres)"]], "steps": ["Refoga a cebola, o alho e a batata em azeite por 3 minutos.", "Junta o caldo e coze 12 minutos, até a batata ficar macia.", "Junta as ervilhas e a hortelã. Coze só 5 a 6 minutos.", "Tritura até ficar bem cremoso.", "Junta as natas se quiseres, prova e acerta o sal.", "Serve com uma folhinha de hortelã e um fio de azeite."], "pair": ["Pão torrado", "Ovo escalfado por cima", "Presunto crocante picado (versão não vegetariana)"], "tip": "Não cozas as ervilhas demais: passam de verde vivo a verde apagado em poucos minutos."}, {"pt": "Arroz de pato e enchidos", "en": "Duck Rice with Cured Sausages", "cats": ["arroz"], "day": "5ª feira", "img": "https://i.pinimg.com/originals/f5/68/ba/f568ba2af8d2c15564160bf387941ec0.png", "desc": "O arroz de forno mais famoso de Portugal: pato desfiado, topo crocante e chouriço por cima.", "prep": 20, "cook": 60, "total": 80, "diff": "Médio", "serves": 4, "ings": [[600, "g", "pato (metade de um pato ou pernas)"], [300, "g", "arroz carolino"], [1, "", "cebola"], [2, "dentes", "alho"], [1, "folha", "louro"], [100, "g", "chouriço em rodelas"], [900, "ml", "água (para cozer o pato — guarda o caldo)"], [null, "", "azeite, sal e pimenta"]], "steps": ["Coze o pato em água com sal, louro e meia cebola por 40 minutos, até ficar bem tenro. Guarda o caldo — é ouro.", "Tira o pato, deixa arrefecer um pouco, desfia a carne e tira peles e ossos.", "Refoga a outra metade da cebola e o alho em azeite. Junta o arroz e mexe 1 minuto.", "Junta o caldo do pato (o dobro do volume do arroz) e coze 12 a 15 minutos.", "Mistura o pato desfiado no arroz e passa tudo para um tabuleiro de forno.", "Põe as rodelas de chouriço por cima e leva ao forno a 200°C por 15 minutos, até o topo ficar crocante e dourado."], "pair": ["Salada verde com laranja", "Legumes assados", "Uma salada de tomate simples"], "tip": "O topo crocante é a assinatura deste prato. Não saltes o passo do forno no fim."}, {"pt": "Caril de grão-de-bico e legumes", "en": "Chickpea & Vegetable Curry", "cats": ["caril", "vegetariano"], "day": "5ª feira", "img": "https://static1.minhavida.com.br/recipes/ee/3f/b5/19/curry-com-legumes-e-grao-de-bico-orig-1.jpg", "desc": "Quentinho, cheio de especiarias e pronto numa panela só.", "prep": 10, "cook": 25, "total": 35, "diff": "Fácil", "serves": 4, "ings": [[400, "g", "grão-de-bico já cozido"], [1, "", "cebola picada"], [2, "dentes", "alho picado"], [1, "c. chá", "gengibre ralado"], [2, "c. sopa", "caril em pó"], [400, "ml", "leite de coco"], [200, "g", "tomate triturado"], [1, "", "curgete em cubos"], [1, "", "pimento em cubos"], [1, "punhado", "espinafres"], [null, "", "azeite, sal, coentros e sumo de limão"]], "steps": ["Refoga a cebola, o alho e o gengibre em azeite por 3 minutos.", "Junta o caril em pó e mexe 30 segundos — vai cheirar muito bem, é esse o ponto.", "Junta o tomate e o leite de coco e mexe até ligar.", "Junta o grão e os legumes. Coze 15 a 20 minutos, até os legumes ficarem macios.", "Junta os espinafres e deixa murchar 1 minuto.", "Termina com sumo de limão e coentros picados. Prova e acerta o sal."], "pair": ["Arroz basmati", "Pão naan ou pita morno", "Iogurte natural ao lado, para refrescar", "Salada de pepino"], "tip": "Se o caril ficar picante demais, uma colher de iogurte ou mais leite de coco resolve logo."}, {"pt": "Sopa de espinafres", "en": "Spinach Soup", "cats": ["sopas"], "day": "6ª feira", "img": "https://frostedthyme.com/assets/images/1769536434538-8rz32d9f.webp", "desc": "Sopa verde e leve, à portuguesa: base cremosa de batata com os espinafres a entrar no fim.", "prep": 10, "cook": 20, "total": 30, "diff": "Fácil", "serves": 4, "ings": [[300, "g", "espinafres frescos"], [2, "", "batatas"], [1, "", "cebola"], [2, "dentes", "alho"], [900, "ml", "caldo ou água quente"], [null, "", "azeite, sal e uma pitada de noz-moscada"], [null, "", "um fio de natas (se quiseres)"]], "steps": ["Coze as batatas, a cebola e o alho no caldo por 15 minutos.", "Tritura até ficar um creme liso.", "Volta a pôr ao lume e junta os espinafres.", "Coze só 3 a 4 minutos, até murcharem e ficarem verde vivos.", "Tempera com sal e noz-moscada.", "Serve com um fio de azeite ou de natas."], "pair": ["Pão torrado", "Ovo cozido às fatias por cima", "Croutons"], "tip": "Na sopa portuguesa os espinafres não se trituram todos — entram no fim, no creme já feito. Fica com mais textura."}, {"pt": "Dourada assada com escabeche e batata assada", "en": "Roasted Sea Bream with Escabeche & Roast Potatoes", "cats": ["peixe"], "day": "6ª feira", "img": "https://teleculinaria.pt/wp-content/uploads/2025/10/sblxkm7p6tii.jpg", "desc": "Peixe inteiro no forno com aquele molho avinagrado de cebola e pimento por cima.", "prep": 15, "cook": 35, "total": 50, "diff": "Médio", "serves": 4, "ings": [[2, "", "douradas inteiras limpas (ou 4 filetes)"], [3, "", "batatas em rodelas"], [1, "", "cebola em rodelas"], [1, "", "pimento em tiras"], [2, "dentes", "alho laminado"], [100, "ml", "vinagre de vinho branco"], [100, "ml", "azeite"], [1, "folha", "louro"], [1, "c. chá", "paprica"], [null, "", "sal, pimenta, limão e salsa picada"]], "steps": ["Forno a 200°C. Põe as batatas num tabuleiro com azeite e sal e assa 20 minutos, para adiantar.", "Tempera o peixe com sal e limão, põe por cima das batatas e assa mais 15 a 18 minutos.", "Entretanto faz o escabeche: aquece o azeite e amolece a cebola, o pimento, o alho e o louro, sem deixar queimar.", "Junta a paprica e o vinagre, deixa ferver 1 a 2 minutos e desliga.", "Deita o escabeche bem quente por cima do peixe assado.", "Deixa repousar 5 minutos, polvilha com salsa e serve com as batatas."], "pair": ["Salada de tomate", "Brócolos ou grelos salteados", "Arroz branco ao lado"], "tip": "O escabeche deve ir quente para cima do peixe — é o contraste que o torna especial. No dia a seguir, frio, também é ótimo."}, {"pt": "Bulgur com legumes e amendoim", "en": "Bulgur with Vegetables & Peanut", "cats": ["arroz", "vegetariano"], "day": "6ª feira", "img": "https://pp-feed.continente.pt/media/2lupi2rt/legumes-forno-bulgur.jpg?anchor=center&mode=crop&width=735&height=551&rnd=133413328751630000&format=webp", "desc": "Grãos soltinhos, legumes crocantes e amendoim tostado — rápido e diferente.", "prep": 10, "cook": 15, "total": 25, "diff": "Fácil", "serves": 4, "ings": [[250, "g", "bulgur"], [500, "ml", "caldo quente"], [1, "", "curgete em cubos"], [1, "", "pimento em cubos"], [1, "", "cenoura em cubos"], [100, "g", "milho ou ervilhas"], [50, "g", "amendoins tostados"], [2, "c. sopa", "manteiga de amendoim (para o molho, se quiseres)"], [null, "", "azeite, sal, limão e coentros"]], "steps": ["Deita o caldo quente sobre o bulgur, tapa e deixa repousar 12 a 15 minutos, até absorver tudo.", "Salteia os legumes em azeite 6 a 7 minutos — devem ficar macios mas ainda crocantes.", "Solta o bulgur com um garfo.", "Mistura os legumes e os amendoins.", "Se fizeres o molho: mistura a manteiga de amendoim com um pouco de água morna e sumo de limão até ficar cremoso, e rega por cima.", "Termina com coentros picados e serve."], "pair": ["Frango ou peixe grelhado ao lado", "Ovo estrelado por cima", "Salada de pepino fresquinha"], "tip": "O bulgur não se coze como arroz: é só deixar de molho em caldo quente, tapado."}, {"pt": "Creme de alho-francês", "en": "Leek Cream Soup", "cats": ["sopas"], "day": "Sábado", "img": "https://www.dicasedicas.com.br/_next/image?url=https%3A%2F%2Fd135llbe2j366l.cloudfront.net%2Fcompressed%2Fsopa-cremosa-de-alho-poro-google.webp&w=672&q=50", "desc": "Sopa clarinha, suave e cremosa — daquelas que sabem a conforto.", "prep": 10, "cook": 25, "total": 35, "diff": "Fácil", "serves": 4, "ings": [[3, "", "alhos-franceses em rodelas"], [2, "", "batatas"], [1, "", "cebola"], [2, "dentes", "alho"], [900, "ml", "caldo ou água quente"], [null, "", "manteiga ou azeite, sal, pimenta e noz-moscada"], [null, "", "natas e cebolinho (se quiseres, para servir)"]], "steps": ["Lava muito bem o alho-francês já cortado — ele guarda areia entre as camadas.", "Refoga a cebola e o alho-francês na manteiga ou azeite por 5 minutos, sem deixar dourar.", "Junta a batata em cubos e o caldo. Coze 20 minutos.", "Tritura até ficar bem cremoso.", "Tempera com sal, pimenta e noz-moscada.", "Serve com um fio de natas e cebolinho picado."], "pair": ["Pão torrado com queijo", "Croutons", "Bacon crocante picado por cima (versão não vegetariana)"], "tip": "Não deixes o alho-francês dourar no refogado: a sopa deve ficar clarinha e suave, não castanha."}, {"pt": "Bacalhau à Brás", "en": "Salt Cod à Brás Style", "cats": ["peixe"], "day": "Sábado", "img": "https://gelarecipes.com/wp-content/uploads/2025/10/Bacalhau-Brs.jpg", "desc": "Bacalhau desfiado, batata palha e ovo cremoso, com azeitonas e salsa. Um favorito de sempre.", "prep": 15, "cook": 15, "total": 30, "diff": "Médio", "serves": 4, "ings": [[400, "g", "bacalhau demolhado e desfiado"], [4, "", "ovos"], [1, "", "cebola grande em meias-luas finas"], [2, "dentes", "alho picado"], [200, "g", "batata palha"], [null, "", "azeitonas pretas, salsa picada, azeite, sal e pimenta"]], "steps": ["Refoga a cebola e o alho em azeite generoso, em lume médio, até a cebola ficar macia e a começar a dourar.", "Junta o bacalhau desfiado e cozinha 3 a 4 minutos, mexendo.", "Junta a batata palha e mistura bem.", "Baixa o lume. Bate os ovos e deita por cima, mexendo devagar.", "Quando o ovo estiver cremoso — ainda um bocadinho húmido — desliga logo. Ele acaba de cozer com o calor da frigideira.", "Passa para a travessa, polvilha com salsa e põe as azeitonas. Serve já, sem esperar."], "pair": ["Salada de alface e tomate", "Pão para acompanhar", "A sopa do dia, antes, como no menu"], "tip": "O erro mais comum é deixar o ovo secar. Tira do lume antes do ponto — à Brás quer-se cremoso, não seco."}, {"pt": "Tortilha de cogumelos e espinafre", "en": "Mushroom & Spinach Tortilla", "cats": ["vegetariano"], "day": "Sábado", "img": "https://www.breannarecipes.com/wp-content/uploads/2025/10/zq1tmlpmmjtfdifqy51p.webp", "desc": "Alta, fofa e cheia de cogumelos — ótima quente, morna ou até no dia a seguir.", "prep": 10, "cook": 20, "total": 30, "diff": "Fácil", "serves": 4, "ings": [[6, "", "ovos"], [250, "g", "cogumelos laminados"], [150, "g", "espinafres"], [1, "", "cebola picada"], [2, "dentes", "alho picado"], [50, "g", "queijo ralado (se quiseres)"], [null, "", "azeite, sal, pimenta e noz-moscada"]], "steps": ["Salteia a cebola e os cogumelos em azeite até a água deles evaporar e começarem a dourar.", "Junta o alho e os espinafres e mexe até murcharem. Tira do lume e escorre qualquer líquido a mais.", "Bate os ovos com sal, pimenta e noz-moscada. Junta a mistura de cogumelos e o queijo.", "Deita tudo numa frigideira antiaderente com um fio de azeite, em lume baixo. Tapa e coze 8 a 10 minutos.", "Quando a base estiver firme, vira a tortilha com a ajuda de um prato e coze mais 3 a 4 minutos do outro lado. (Ou gratina no forno.)", "Deixa repousar 5 minutos e corta em fatias, como um bolo."], "pair": ["Salada de tomate", "Pão caseiro", "Batatas no forno", "Como segundo prato, depois da sopa"], "tip": "Espinafres e cogumelos largam água. Se não a tirares, a tortilha fica mole em vez de fofa."}, {"pt": "Creme de legumes assados", "en": "Roasted Vegetable Cream Soup", "cats": ["sopas"], "day": "Domingo", "img": "https://www.dicasedicas.com.br/_next/image?url=https%3A%2F%2Fd135llbe2j366l.cloudfront.net%2Fcompressed%2Fsopa-nutritiva-de-legumes-e-verduras-02-google.webp&w=750&q=50", "desc": "Como o creme de legumes, mas com os legumes assados primeiro: sabor mais fundo e docinho.", "prep": 10, "cook": 40, "total": 50, "diff": "Fácil", "serves": 4, "ings": [[2, "", "cenouras"], [1, "", "curgete"], [1, "", "pimento vermelho"], [1, "", "cebola"], [1, "", "batata-doce (ou batata normal)"], [2, "dentes", "alho"], [800, "ml", "caldo ou água quente"], [null, "", "azeite, sal, pimenta, tomilho e paprica (se gostares)"]], "steps": ["Liga o forno a 200°C. Corta os legumes em pedaços grandes.", "Põe num tabuleiro com azeite, sal, pimenta e tomilho. Assa 30 minutos, até ficarem macios e dourados nas pontas.", "Passa tudo para uma panela, junta o caldo e deixa ferver 5 minutos.", "Tritura até ficar um creme liso.", "Prova e acerta os temperos.", "Serve quente, com um fio de azeite ou de natas."], "pair": ["Tosta de queijo (a nossa tosta mista)", "Pão torrado", "Croutons de alho"], "tip": "Compara com o Creme de legumes de 4ª feira: mesmos legumes, técnica diferente. Assar muda tudo."}, {"pt": "Bifes de peru grelhados com legumes grelhados e macarrão", "en": "Grilled Turkey Steaks with Grilled Vegetables & Pasta", "cats": ["carne"], "day": "Domingo", "img": "https://guiadacozinha.com.br/wp-content/uploads/2013/01/filegrelhadocomlegumes.webp", "desc": "Peru grelhado e leve, legumes com marcas da grelha e massa com alho e salsa.", "prep": 10, "cook": 20, "total": 30, "diff": "Fácil", "serves": 4, "ings": [[4, "", "bifes de peru"], [2, "dentes", "alho picado"], [0.5, "", "limão (o sumo)"], [1, "c. chá", "paprica"], [1, "", "curgete em fatias"], [1, "", "pimento em tiras"], [1, "", "cebola em rodelas grossas"], [250, "g", "macarrão ou outra massa curta"], [null, "", "azeite, sal, pimenta e salsa picada"]], "steps": ["Tempera o peru com alho, paprica, limão, azeite, sal e pimenta. Deixa 10 minutos.", "Coze a massa em água com sal. Guarda um pouco da água da cozedura.", "Grelha os legumes numa grelha ou frigideira bem quente, 3 a 4 minutos de cada lado. Tempera com sal.", "Grelha o peru 4 a 5 minutos de cada lado, até ficar bem passado por dentro. Rega com limão no fim.", "Salteia a massa com azeite e alho, um pouco da água da cozedura e salsa.", "Serve o peru fatiado com os legumes e a massa ao lado."], "pair": ["Salada verde", "Molho de iogurte com ervas", "Arroz, se preferires em vez da massa"], "tip": "Frigideira bem quente e não mexer logo no peru: é assim que se fazem as marcas bonitas da grelha."}, {"pt": "Fusilli com legumes assados", "en": "Fusilli with Roasted Vegetables", "cats": ["massas", "vegetariano"], "day": "Domingo", "img": "https://www.thegardengrazer.com/wp-content/uploads/2014/03/roasted-vegetable-pasta-cover-75-1.jpg", "desc": "Massa em espiral com legumes assados coloridos — simples e cheia de sabor.", "prep": 10, "cook": 30, "total": 40, "diff": "Fácil", "serves": 4, "ings": [[320, "g", "fusilli"], [1, "", "curgete em cubos"], [1, "", "pimento em cubos"], [1, "", "cebola roxa em pedaços"], [200, "g", "tomate cereja"], [2, "dentes", "alho"], [null, "", "azeite, sal, pimenta, orégãos ou manjericão"], [null, "", "queijo parmesão ou feta (se quiseres)"]], "steps": ["Forno a 200°C. Põe os legumes num tabuleiro grande, numa só camada, com azeite, sal, pimenta e orégãos.", "Assa 25 minutos, mexendo a meio, até ficarem macios e dourados.", "Coze o fusilli em água com sal. Guarda uma chávena da água da cozedura.", "Junta a massa aos legumes, com um pouco da água da cozedura e um fio de azeite. Mexe bem.", "Junta o queijo e as ervas frescas.", "Serve quente, com mais queijo por cima se quiseres."], "pair": ["Salada de rúcula", "Frango grelhado ao lado", "Queijo feta ou burrata por cima"], "tip": "Tabuleiro grande e legumes numa só camada. Se ficarem amontoados, cozem a vapor em vez de assar."}, {"pt": "Esparguete à carbonara", "en": "Spaghetti Carbonara", "cats": ["massas", "italiana"], "day": "🇮🇹 Italiana", "img": "https://www.theseasonedmom.com/wp-content/uploads/2021/06/easy-carbonara-recipe-7.jpg", "desc": "O clássico de Roma: massa cremosa de ovo e queijo, sem natas — o truque está na técnica.", "prep": 10, "cook": 15, "total": 25, "diff": "Médio", "serves": 4, "ings": [[320, "g", "esparguete"], [150, "g", "guanciale ou pancetta (ou bacon) em tiras"], [3, "", "gemas de ovo"], [1, "", "ovo inteiro"], [60, "g", "queijo pecorino ou parmesão ralado fino"], [null, "", "pimenta preta moída na hora e sal"]], "steps": ["Coze o esparguete em água bem salgada. Guarda uma chávena da água da cozedura — vais precisar dela.", "Frita o guanciale numa frigideira grande, sem azeite, até ficar dourado e crocante. Desliga o lume.", "Numa tigela, bate as gemas, o ovo, o queijo e bastante pimenta. Fica uma pasta grossa.", "Escorre a massa e deita-a na frigideira, fora do lume.", "Junta a mistura de ovo e um pouco da água da cozedura. Mexe rápido — o calor da massa faz um molho cremoso, sem cozinhar o ovo.", "Serve já, com mais queijo e pimenta por cima."], "pair": ["Salada verde simples", "Um copo de água com limão, para cortar a riqueza", "Pão para aproveitar o molho"], "tip": "Fora do lume, sempre. Se a frigideira estiver a ferver, o ovo vira omelete — e carbonara quer-se cremosa."}, {"pt": "Risotto de cogumelos", "en": "Mushroom Risotto", "cats": ["arroz", "italiana", "vegetariano"], "day": "🇮🇹 Italiana", "img": "https://ellaeasymeals.com/wp-content/uploads/2025/10/image_x2-11.png", "desc": "Cremoso, com o arroz a soltar o seu próprio molho. Precisa de atenção, mas não é difícil.", "prep": 10, "cook": 30, "total": 40, "diff": "Médio", "serves": 4, "ings": [[300, "g", "arroz arbório (arroz de risotto)"], [300, "g", "cogumelos laminados"], [1, "", "cebola bem picada"], [2, "dentes", "alho picado"], [1200, "ml", "caldo de legumes quente"], [100, "ml", "vinho branco (ou mais caldo)"], [40, "g", "manteiga"], [50, "g", "parmesão ralado"], [null, "", "azeite, sal, pimenta e salsa"]], "steps": ["Salteia os cogumelos em azeite bem quente até dourarem. Guarda à parte.", "Na mesma panela, refoga a cebola e o alho em azeite e um pouco de manteiga, 3 minutos.", "Junta o arroz e mexe 1 a 2 minutos, até os grãos ficarem brilhantes.", "Deita o vinho e deixa evaporar, a mexer.", "Vai juntando o caldo quente, uma concha de cada vez, sempre a mexer. Só juntas a próxima quando a anterior for absorvida. Leva uns 18 minutos.", "Quando o arroz estiver macio mas ainda com um dentinho no meio, desliga. Junta a manteiga, o parmesão e os cogumelos. Tapa 2 minutos e serve logo."], "pair": ["Salada de rúcula com limão", "Frango grelhado ao lado", "Um fio de azeite de trufa, para dias especiais"], "tip": "Risotto não espera por ninguém: serve-se assim que fica pronto, senão continua a engrossar na panela."}, {"pt": "Bruschetta de tomate e manjericão", "en": "Tomato & Basil Bruschetta", "cats": ["vegetariano", "italiana"], "day": "🇮🇹 Italiana", "img": "https://easypeasyrecipes.net/wp-content/uploads/2025/09/Screenshot-2025-09-16-at-11.38.40-PM.png.webp", "desc": "Pão tostado, tomate maduro, manjericão e um bom azeite. A entrada mais simples de Itália.", "prep": 10, "cook": 5, "total": 15, "diff": "Fácil", "serves": 4, "ings": [[4, "fatias grandes", "pão rústico"], [4, "", "tomates maduros em cubos"], [1, "dente", "alho cortado ao meio"], [8, "folhas", "manjericão"], [3, "c. sopa", "azeite bom"], [null, "", "sal e pimenta"], [null, "", "vinagre balsâmico (se quiseres)"]], "steps": ["Põe o tomate numa tigela com sal e deixa repousar 10 minutos — o sal tira o sumo e concentra o sabor.", "Escorre o tomate, junta o azeite, a pimenta e o manjericão rasgado com as mãos.", "Tosta o pão até ficar dourado e crocante.", "Esfrega a parte cortada do alho no pão ainda quente. Cheira logo bem.", "Põe o tomate por cima do pão, com uma colher.", "Termina com um fio de azeite (e umas gotas de balsâmico, se quiseres) e serve já."], "pair": ["Como entrada, antes de uma massa", "Com uma sopa, faz uma refeição leve", "Ao lado de uma salada caprese"], "tip": "Faz tudo à última hora: se o tomate ficar no pão, o pão amolece — e bruschetta quer-se crocante."}, {"pt": "Frango à caçadora", "en": "Chicken Cacciatore", "cats": ["carne", "italiana"], "day": "🇮🇹 Italiana", "img": "https://www.feastingathome.com/wp-content/uploads/2022/03/chicken-cacciatore-12.jpg", "desc": "Frango cozinhado devagar num molho de tomate, pimentos e azeitonas, à maneira dos caçadores.", "prep": 15, "cook": 40, "total": 55, "diff": "Médio", "serves": 4, "ings": [[800, "g", "coxas e pernas de frango"], [1, "", "cebola em fatias"], [1, "", "pimento vermelho em tiras"], [2, "dentes", "alho picado"], [400, "g", "tomate triturado"], [100, "ml", "vinho tinto ou caldo"], [80, "g", "azeitonas"], [null, "", "azeite, sal, pimenta, orégãos e salsa"]], "steps": ["Tempera o frango com sal e pimenta e doura-o em azeite, 4 minutos de cada lado. Guarda à parte.", "Na mesma panela, refoga a cebola e o pimento 5 minutos. Junta o alho no fim.", "Deita o vinho (ou caldo) e raspa o fundo da panela — é onde está o sabor.", "Junta o tomate, os orégãos e as azeitonas. Volta a pôr o frango.", "Tapa e coze em lume brando 30 minutos, até o frango ficar tenro e o molho grossinho.", "Polvilha com salsa e serve bem quente."], "pair": ["Arroz branco", "Massa curta", "Pão rústico para o molho", "Purè de batata"], "tip": "Este molho fica ainda melhor no dia a seguir. Faz a mais e guarda uma refeição."}, {"pt": "Tiramisù", "en": "Tiramisu", "cats": ["sobremesas", "italiana"], "day": "🇮🇹 Italiana", "img": "https://www.premiumco.gr/wp-content/uploads/2025/10/u3397256191_SLICE_OF_TIRAMISU_-v_7_e75670c3-3f11-4291-890a-1cb6d16fd05c_3.png", "desc": "Camadas de palitos embebidos em café e um creme leve de mascarpone. Sem forno.", "prep": 25, "cook": 0, "total": 25, "diff": "Médio", "serves": 6, "ings": [[250, "g", "queijo mascarpone"], [200, "ml", "natas para bater bem frias"], [3, "", "ovos (gemas e claras separadas)"], [80, "g", "açúcar"], [200, "g", "palitos de champanhe (biscoitos)"], [250, "ml", "café forte, já frio"], [null, "", "cacau em pó, para polvilhar"]], "steps": ["Bate as gemas com o açúcar até ficar um creme claro e fofo.", "Junta o mascarpone e mexe até ligar, sem bater demais.", "Bate as natas bem firmes e envolve no creme. Bate as claras em castelo e envolve também, com cuidado.", "Passa cada palito pelo café — rápido, só molhar, senão desmancha-se.", "Faz camadas numa travessa: palitos, creme, palitos, creme.", "Guarda no frigorífico pelo menos 4 horas (de um dia para o outro é o ideal). Polvilha com cacau antes de servir."], "pair": ["Um café expresso ao lado", "Depois de um jantar de massa", "Frutos vermelhos por cima, para um toque fresco"], "tip": "O tiramisù não se come no próprio dia em que se faz — precisa de horas de frigorífico para firmar e ganhar sabor."}, {"pt": "Pastéis de bacalhau", "en": "Portuguese Salt Cod Fritters", "cats": ["peixe", "portuguesa"], "day": "🇵🇹 Portuguesa", "img": "https://blogger.googleusercontent.com/img/a/AVvXsEhkiVvOYqmyHBqc1MLsm6AFvpp4_G4ehFpQm4lTM6ZM_ILT1L8ct80wpTuqW88itm_7j9vLa6cDpHfAS3KWAHg3ijYL3Ioiua-xH213AAcOCb4arydDlfEcn-Eecw-qQ89f-OTtJ5QdIHwvRRmBFIc3Cixfu20xzl9HOmAhdQ38e0tc0SEAK5TpYJ4K2N0=w1200-h630-p-k-no-nu", "desc": "Bolinhos dourados e fofos de bacalhau e batata — também chamados bolinhos no norte.", "prep": 20, "cook": 20, "total": 40, "diff": "Médio", "serves": 4, "ings": [[300, "g", "bacalhau demolhado"], [300, "g", "batatas"], [1, "", "cebola bem picada"], [2, "", "ovos"], [null, "", "salsa picada, sal, pimenta e noz-moscada"], [null, "", "óleo para fritar"]], "steps": ["Coze as batatas e o bacalhau. Escorre bem os dois — este passo é muito importante.", "Faz puré das batatas ainda quentes e desfia o bacalhau bem fininho, sem espinhas.", "Mistura o bacalhau, o puré, a cebola, a salsa e os temperos. Junta os ovos um a um, até ficar uma massa que se molda.", "Com duas colheres molhadas, molda bolinhos do tamanho de um ovo pequeno.", "Frita em óleo quente até dourarem por todo o lado. Escorre em papel de cozinha.", "Serve quentes ou mornos — frios também são bons, em piquenique."], "pair": ["Arroz de tomate", "Salada de alface e cebola", "Como petisco, com uma cerveja ou um sumo bem fresco"], "tip": "A massa tem de estar bem seca. Se o bacalhau ou a batata tiverem água a mais, os pastéis abrem-se no óleo."}, {"pt": "Amêijoas à Bulhão Pato", "en": "Clams Bulhão Pato Style", "cats": ["peixe", "portuguesa"], "day": "🇵🇹 Portuguesa", "img": "https://turismoportugal.org/wp-content/uploads/2023/02/ameijoas-bulhao-pato-e1676921850985.jpg", "desc": "Amêijoas abertas num molho de azeite, alho, coentros e limão. Demora minutos.", "prep": 10, "cook": 10, "total": 20, "diff": "Fácil", "serves": 4, "ings": [[1000, "g", "amêijoas frescas"], [4, "dentes", "alho laminado"], [100, "ml", "azeite"], [100, "ml", "vinho branco"], [1, "molho", "coentros picados"], [0.5, "", "limão (o sumo)"], [null, "", "sal e pimenta"]], "steps": ["Deixa as amêijoas em água com sal durante 1 a 2 horas, para largarem a areia. Passa bem por água.", "Aquece o azeite numa panela larga e junta o alho, sem o deixar queimar.", "Junta as amêijoas e o vinho, tapa e coze 3 a 5 minutos, abanando a panela.", "Quando abrirem, estão prontas. Deita fora as que ficarem fechadas.", "Junta os coentros e o sumo de limão, mexe uma vez.", "Serve logo na panela, com o molho — e muito pão ao lado."], "pair": ["Pão torrado ou fresco, para o molho", "Batatas fritas caseiras", "Como entrada, antes de um peixe grelhado"], "tip": "O molho é metade do prato. Se não houver pão para o aproveitar, inventa — vale a pena."}, {"pt": "Arroz de marisco", "en": "Portuguese Seafood Rice", "cats": ["arroz", "peixe", "portuguesa"], "day": "🇵🇹 Portuguesa", "img": "https://fqylyqhraxwipdpjvbuh.supabase.co/storage/v1/object/public/recipe-images-public/seeds/seafood-rice.webp", "desc": "Arroz caldoso, cheio de marisco e com sabor a mar. O prato de festa português.", "prep": 20, "cook": 30, "total": 50, "diff": "Médio", "serves": 4, "ings": [[300, "g", "arroz carolino"], [300, "g", "camarão"], [300, "g", "amêijoas ou mexilhão"], [200, "g", "lulas ou peixe em cubos"], [1, "", "cebola picada"], [2, "dentes", "alho picado"], [2, "", "tomates maduros picados (ou 200 g de tomate triturado)"], [1200, "ml", "caldo de peixe ou água quente"], [null, "", "azeite, sal, pimenta, louro e coentros"]], "steps": ["Refoga a cebola e o alho em azeite. Junta o tomate e o louro e deixa apurar 5 minutos.", "Junta o arroz e mexe 1 minuto.", "Deita o caldo quente e coze em lume médio 10 minutos.", "Junta as lulas (ou peixe) e o camarão. Coze mais 5 minutos.", "Junta as amêijoas, tapa e espera que abram, uns 3 minutos.", "Desliga quando o arroz ainda estiver caldoso — ele continua a absorver. Polvilha com coentros e serve logo, da panela para a mesa."], "pair": ["Salada verde simples", "Pão, para o caldo", "Um toque de piri-piri para quem gosta"], "tip": "Arroz de marisco é caldoso, não é seco. Se absorver demais, junta um copo de água quente no fim, sem vergonha."}, {"pt": "Francesinha", "en": "Francesinha — Porto's Famous Sandwich", "cats": ["carne", "portuguesa"], "day": "🇵🇹 Portuguesa", "img": "https://www.wonderbox.fr/blog/wp-content/uploads/sites/4/2024/11/la-francesinha-porto-768x549.jpg", "desc": "A sandes do Porto: carnes, queijo derretido e um molho de tomate e cerveja por cima de tudo.", "prep": 20, "cook": 25, "total": 45, "diff": "Médio", "serves": 2, "ings": [[2, "fatias grossas", "pão de forma (4, se forem finas)"], [2, "", "bifes finos de vaca"], [2, "", "salsichas frescas"], [4, "fatias", "fiambre"], [8, "fatias", "queijo"], [1, "", "linguiça em rodelas"], [330, "ml", "cerveja"], [200, "ml", "polpa/caldo de tomate e um pouco de caldo de carne"], [null, "", "piri-piri, sal e pimenta (e batatas fritas para acompanhar)"]], "steps": ["Grelha os bifes, as salsichas e a linguiça. Tempera com sal e pimenta.", "Monta cada sandes: pão, fiambre, bife, salsicha, pão por cima.", "Cobre cada sandes com fatias de queijo por todos os lados, como um cobertor.", "Leva ao forno a 200°C até o queijo derreter e começar a dourar.", "Faz o molho: ferve a cerveja com o tomate e o caldo 10 minutos, tempera com piri-piri a gosto, até ficar um molho liso e aveludado.", "Deita o molho bem quente por cima das sandes e serve com batatas fritas à volta — e molho extra."], "pair": ["Batatas fritas (obrigatório, dizem no Porto)", "Ovo estrelado por cima (a chamada 'com ovo')", "Uma cerveja fresca ou um refrigerante bem gelado"], "tip": "O molho faz a francesinha: deve ser abundante, quente e a cobrir tudo. Não tenhas medo da quantidade."}, {"pt": "Pastel de nata", "en": "Portuguese Custard Tart", "cats": ["sobremesas", "portuguesa"], "day": "🇵🇹 Portuguesa", "img": "https://flavornest.net/wp-content/uploads/2025/05/image_2025-05-05_205604555.webp", "desc": "Folhado crocante e creme de ovo com canela. Quente, acabado de sair do forno, é outra coisa.", "prep": 25, "cook": 20, "total": 45, "diff": "Médio", "serves": 6, "ings": [[1, "rolo", "massa folhada"], [250, "ml", "leite"], [150, "g", "açúcar"], [3, "c. sopa", "farinha"], [4, "", "gemas de ovo"], [1, "pau", "canela e 1 casca de limão"], [null, "", "canela em pó e açúcar em pó, para servir"]], "steps": ["Leva o leite ao lume com a canela e o limão até quase ferver. Tira do lume.", "Mistura o açúcar com a farinha e junta um pouco do leite quente, a mexer. Depois junta tudo ao leite e coze, sempre a mexer, até engrossar como um creme.", "Tira do lume, deixa amornar 5 minutos e junta as gemas uma a uma, a mexer rápido.", "Estende a massa folhada, enrola-a como um rolo, corta fatias e forra forminhas de queques, espalhando a massa com os polegares molhados.", "Enche as formas até 3/4 com o creme.", "Forno bem quente, 250°C, 12 a 15 minutos, até o creme ganhar aquelas manchinhas tostadas. Serve morno, com canela."], "pair": ["Um café (uma 'bica', como se diz em Lisboa)", "Sozinhos, ainda mornos", "Com uma bola de gelado de baunilha"], "tip": "Forno no máximo é o segredo das manchas tostadas. Sem medo: é mesmo assim que eles são."}, {"pt": "Matapa com arroz", "en": "Matapa — Cassava Leaves with Peanut & Coconut", "cats": ["vegetariano", "mocambicana"], "day": "🇲🇿 Moçambicana", "img": "https://receitasmocambicanaseconomicas.lovable.app/assets/prato-matapa-B5_Pl47Y.jpg", "desc": "O prato de alma de Moçambique: folhas de mandioca em molho de amendoim e coco.", "prep": 15, "cook": 45, "total": 60, "diff": "Médio", "serves": 4, "ings": [[500, "g", "folhas de mandioca piladas (matapa; ou espinafres bem picados)"], [400, "ml", "leite de coco"], [150, "g", "amendoim moído (ou manteiga de amendoim natural)"], [1, "", "cebola picada"], [2, "dentes", "alho picado"], [200, "g", "camarão (se quiseres a versão de festa)"], [null, "", "sal e um pouco de água quente"], [300, "g", "arroz, para acompanhar"]], "steps": ["Se usares folhas frescas, pila ou pica muito bem. Hoje em dia vendem-se já piladas e congeladas — poupa muito trabalho.", "Ferve as folhas em água com sal 20 minutos, para tirar o amargo. Escorre.", "Refoga a cebola e o alho. Junta as folhas escorridas.", "Junta o leite de coco e o amendoim moído, aos poucos, mexendo para não pegar.", "Coze em lume brando 20 a 25 minutos, mexendo de vez em quando, até o molho ficar cremoso e ligado.", "Se fizeres a versão com camarão, junta-o nos últimos 5 minutos. Serve por cima de arroz branco bem soltinho."], "pair": ["Arroz branco (o clássico)", "Xima, para a versão mais tradicional", "Caril de camarão ao lado, em dia de festa"], "tip": "Matapa boa é cremosa e sem grumos de amendoim. Mexe com calma e junta o amendoim aos poucos."}, {"pt": "Frango piri-piri", "en": "Mozambican Piri-Piri Chicken", "cats": ["carne", "mocambicana"], "day": "🇲🇿 Moçambicana", "img": "https://www.justinerecipes.com/wp-content/uploads/2025/06/Mozambican-Peri-Peri-Grilled-Chicken.png", "desc": "Frango marinado e grelhado com o molho de piri-piri que nasceu em Moçambique.", "prep": 20, "cook": 35, "total": 55, "diff": "Médio", "serves": 4, "ings": [[1, "", "frango inteiro aberto ao meio (ou 4 pernas grandes)"], [4, "dentes", "alho esmagado"], [2, "", "malaguetas piri-piri (ou a gosto)"], [1, "", "limão (o sumo)"], [3, "c. sopa", "azeite ou óleo"], [1, "c. chá", "paprica"], [null, "", "sal, pimenta e um molho piri-piri extra para servir"]], "steps": ["Faz a marinada: mistura o alho, o piri-piri picado, o sumo de limão, o azeite, a paprica, sal e pimenta.", "Esfrega bem o frango por todos os lados. Deixa marinar pelo menos 30 minutos — de um dia para o outro é ainda melhor.", "Aquece bem a grelha ou o forno a 200°C.", "Grelha/assa o frango 30 a 35 minutos, virando e pincelando com a marinada, até ficar bem dourado e com a pele tostada nas pontas.", "Deixa repousar 10 minutos antes de cortar.", "Serve com molho piri-piri extra à parte — cada um põe o picante que aguentar."], "pair": ["Batatas fritas", "Arroz de coco", "Salada simples", "Pão para o molho"], "tip": "Picante constrói-se: começa com pouco piri-piri na marinada e serve molho extra à parte. Tirar picante é que não dá."}, {"pt": "Caril de camarão à moçambicana", "en": "Mozambican Prawn Curry", "cats": ["caril", "peixe", "mocambicana"], "day": "🇲🇿 Moçambicana", "img": "https://www.theocooks.com/wp-content/uploads/Prawn-Coconut-Curry-by-Theo-Michaels-Web.jpg", "desc": "Camarão em molho de coco e tomate, com aquele fundo quente das especiarias da costa.", "prep": 15, "cook": 20, "total": 35, "diff": "Fácil", "serves": 4, "ings": [[600, "g", "camarão descascado"], [1, "", "cebola picada"], [2, "dentes", "alho picado"], [2, "", "tomates maduros picados"], [400, "ml", "leite de coco"], [1, "c. sopa", "caril em pó"], [0.5, "", "limão (o sumo)"], [null, "", "óleo, sal e piri-piri a gosto, coentros"]], "steps": ["Tempera o camarão com sal e umas gotas de limão. Guarda.", "Refoga a cebola e o alho em óleo até amolecer. Junta o caril e mexe 30 segundos.", "Junta o tomate e coze 5 minutos, até virar um molho.", "Deita o leite de coco e deixa ferver devagar 5 minutos, para o molho ligar.", "Junta o camarão e coze só 4 a 5 minutos — quando ficar rosado e enroladinho, está pronto.", "Acerta o sal e o piri-piri, junta coentros e serve logo."], "pair": ["Arroz branco ou arroz de coco", "Xima", "Pão para o molho"], "tip": "Camarão cozido demais fica borracha. São poucos minutos: entrou rosado, saiu do lume."}, {"pt": "Galinha à zambeziana", "en": "Zambezian Chicken in Coconut & Lime", "cats": ["carne", "mocambicana"], "day": "🇲🇿 Moçambicana", "img": "https://chefdelightful.info/wp-content/uploads/2026/02/10-4.webp", "desc": "Frango grelhado banhado num molho de coco, lima e piri-piri, como se faz na Zambézia.", "prep": 20, "cook": 40, "total": 60, "diff": "Médio", "serves": 4, "ings": [[1, "", "frango em pedaços (ou 4 pernas)"], [400, "ml", "leite de coco"], [1, "", "lima (o sumo e a raspa)"], [3, "dentes", "alho esmagado"], [1, "", "malagueta piri-piri (ou a gosto)"], [null, "", "óleo, sal e pimenta"]], "steps": ["Tempera o frango com alho, sal, pimenta, metade do sumo de lima e um fio de óleo. Deixa 20 minutos.", "Grelha ou assa o frango até ficar bem dourado e cozinhado por dentro, uns 30 minutos.", "Numa panela, aquece o leite de coco com o resto da lima, a raspa e o piri-piri picado. Deixa ferver devagar 5 minutos, sem tapar.", "Prova o molho: deve saber a coco, lima e um calorzinho no fim. Acerta o sal.", "Põe o frango grelhado numa travessa e deita o molho quente por cima.", "Deixa repousar 5 minutos, para o frango beber o molho, e serve."], "pair": ["Arroz branco ou de coco", "Matapa ao lado", "Salada simples"], "tip": "Aqui o molho não se cozinha com o frango — vai por cima no fim, fresco e a saber a lima. É isso que a distingue do caril."}, {"pt": "Bolo de mandioca e coco", "en": "Cassava & Coconut Cake", "cats": ["sobremesas", "mocambicana"], "day": "🇲🇿 Moçambicana", "img": "https://receitasdepesos.com.br/wp-content/uploads/2026/07/bolo-de-mandioca.png", "desc": "Bolo húmido e denso de mandioca ralada e coco — lanche de casa, em Moçambique e no Brasil.", "prep": 15, "cook": 45, "total": 60, "diff": "Fácil", "serves": 6, "ings": [[500, "g", "mandioca crua ralada fina"], [200, "g", "açúcar"], [200, "ml", "leite de coco"], [100, "g", "coco ralado"], [2, "", "ovos"], [50, "g", "manteiga derretida"], [1, "c. chá", "fermento em pó"], [null, "", "uma pitada de sal"]], "steps": ["Liga o forno a 180°C e unta uma forma com manteiga e farinha.", "Mistura a mandioca ralada com o açúcar, o coco ralado e o sal.", "Junta os ovos, a manteiga derretida e o leite de coco. Mexe bem.", "Junta o fermento no fim e envolve devagar.", "Deita na forma e alisa o topo.", "Assa 40 a 45 minutos, até dourar e um palito sair quase limpo. Deixa arrefecer antes de cortar — corta-se muito melhor morno/frio."], "pair": ["Um chá bem quente", "Café da tarde", "Sozinho, como lanche — como sempre foi"], "tip": "Este bolo é húmido por natureza, não é seco como os bolos de farinha. Se sair cremoso no meio, está certo."}, {"pt": "Feijoada brasileira", "en": "Brazilian Feijoada — Black Bean Stew", "cats": ["carne", "brasileira"], "day": "🇧🇷 Brasileira", "img": "https://dailytripjourney.com/wp-content/uploads/2025/12/feijoada-brazilianfood.jpg", "desc": "Feijão preto cozinhado devagar com carnes, servido com tudo a que tem direito.", "prep": 20, "cook": 90, "total": 110, "diff": "Médio", "serves": 6, "ings": [[500, "g", "feijão preto, demolhado de véspera"], [300, "g", "carne de porco em cubos (entrecosto ou pá)"], [200, "g", "linguiça em rodelas"], [150, "g", "bacon em cubos"], [1, "", "cebola picada"], [3, "dentes", "alho picado"], [2, "folhas", "louro"], [null, "", "sal, pimenta e óleo"]], "steps": ["Coze o feijão demolhado em água nova com o louro, em lume brando, 40 minutos.", "À parte, doura as carnes e a linguiça numa frigideira. É este dourado que dá sabor à feijoada.", "Junta as carnes douradas ao feijão.", "Refoga a cebola, o alho e o bacon e junta também, com a gordura e tudo.", "Coze tudo junto mais 40 a 50 minutos, até o feijão ficar macio e o caldo grosso. Junta água quente se secar.", "Acerta o sal no fim (as carnes já trazem sal). Serve bem quente, com os acompanhamentos ao lado."], "pair": ["Arroz branco", "Couve cortada fininha e salteada com alho", "Laranja às fatias (ajuda a digestão, dizem — e é verdade que refresca)", "Farofa por cima"], "tip": "Feijoada é comida de sábado e de calma. Não tenhas pressa: o lume brando e o tempo fazem o caldo."}, {"pt": "Pão de queijo", "en": "Brazilian Cheese Bread", "cats": ["vegetariano", "brasileira"], "day": "🇧🇷 Brasileira", "img": "https://i.pinimg.com/originals/32/9b/39/329b3912f64bd9209b8e3e4382e34fee.jpg?w=186", "desc": "Bolinhas de queijo sem glúten, crocantes por fora e elásticas por dentro. De Minas Gerais para o mundo.", "prep": 15, "cook": 25, "total": 40, "diff": "Fácil", "serves": 6, "ings": [[250, "g", "polvilho doce (farinha de tapioca)"], [120, "ml", "leite"], [60, "ml", "óleo"], [1, "", "ovo"], [150, "g", "queijo ralado curado (parmesão ou queijo da ilha bem ralado)"], [0.5, "c. chá", "sal"]], "steps": ["Ferve o leite com o óleo e o sal.", "Deita essa mistura quente sobre o polvilho e mexe com uma colher — fica uma massa pegajosa, é normal. Deixa amornar.", "Junta o ovo e amassa com as mãos.", "Junta o queijo ralado e amassa até ligar.", "Faz bolinhas do tamanho de uma noz, com as mãos untadas de óleo.", "Forno a 200°C por 20 a 25 minutos, até crescerem e dourarem. Come-os mornos — é quando estão no ponto."], "pair": ["Café (o par clássico em Minas)", "Requeijão ou doce de leite para barrar", "Como lanche, a qualquer hora"], "tip": "A massa é pegajosa e estranha antes do queijo. Confia: depois de assados ficam leves e elásticos."}, {"pt": "Moqueca de peixe", "en": "Brazilian Fish Stew — Moqueca", "cats": ["peixe", "brasileira"], "day": "🇧🇷 Brasileira", "img": "https://i.pinimg.com/originals/18/1c/c8/181cc8c9b7a87d67af4a92921f238751.png", "desc": "Peixe cozinhado em leite de coco, tomate e pimentos, com cheiro a coentros. Da Bahia.", "prep": 15, "cook": 25, "total": 40, "diff": "Fácil", "serves": 4, "ings": [[600, "g", "postas ou filetes grossos de peixe branco"], [1, "", "cebola em rodelas"], [1, "", "pimento em rodelas"], [2, "", "tomates em rodelas"], [2, "dentes", "alho picado"], [200, "ml", "leite de coco"], [null, "", "azeite (e óleo de dendê, se tiveres, 1 colher), sal, limão e coentros"]], "steps": ["Tempera o peixe com sal, alho e sumo de limão. Deixa 10 minutos.", "Numa panela larga, faz camadas: cebola, pimento, tomate, peixe — e repete.", "Rega com o leite de coco e um fio de azeite (e o dendê, se usares — é ele que dá a cor laranja).", "Tapa e coze em lume médio-baixo 20 minutos, sem mexer com colher — abana a panela, para não desmanchar o peixe.", "Destapa, junta coentros picados e deixa apurar 3 minutos sem tampa.", "Serve logo, com o molho por cima do peixe."], "pair": ["Arroz branco soltinho", "Farofa", "Pirão (o molho engrossado com farinha de mandioca)"], "tip": "Moqueca não se mexe, abana-se. O peixe é frágil e os pedaços bonitos fazem parte do prato."}, {"pt": "Coxinha de frango", "en": "Brazilian Chicken Coxinha", "cats": ["carne", "brasileira"], "day": "🇧🇷 Brasileira", "img": "https://receitascomochef.com.br/wp-content/uploads/2023/11/Coxinha-de-Frango.jpg", "desc": "O salgadinho mais amado do Brasil: massa macia, frango desfiado e aquela forma de gotinha.", "prep": 40, "cook": 20, "total": 60, "diff": "Médio", "serves": 6, "ings": [[300, "g", "peito de frango cozido e desfiado (guarda o caldo)"], [500, "ml", "caldo do frango"], [250, "g", "farinha de trigo"], [1, "", "cebola bem picada"], [2, "dentes", "alho picado"], [null, "", "salsa, sal, pimenta e colorau"], [null, "", "leite e pão ralado, para panar; óleo para fritar"]], "steps": ["Refoga a cebola e o alho, junta o frango desfiado, o colorau, sal, pimenta e salsa. Este é o recheio — prova, deve estar bem temperado.", "Ferve o caldo com um fio de óleo e sal. Junta a farinha de uma vez e mexe com força até virar uma bola de massa que se descola da panela.", "Passa a massa para a bancada e amassa morna até ficar lisa. Deixa arrefecer tapada.", "Pega em pedaços de massa, abre um disco na mão, põe recheio no meio e fecha puxando uma pontinha para cima — a forma de gota (ou de coxinha de galinha!).", "Passa por leite e pão ralado.", "Frita em óleo quente até dourarem. Escorre e serve quentes."], "pair": ["Molho de pimenta suave", "Ketchup e maionese, como nas lanchonetes", "Como petisco de festa, com sumos bem frescos"], "tip": "A massa coze na panela antes de moldar — é isso que a deixa macia em vez de crua por dentro depois de fritar."}, {"pt": "Brigadeiro", "en": "Brazilian Brigadeiro Fudge Balls", "cats": ["sobremesas", "brasileira"], "day": "🇧🇷 Brasileira", "img": "https://www.churchofjesuschrist.org/imgs/954c1145004611eca4aceeeeac1e0759a3a3e9ab/full/!1280%2C1280/0/default", "desc": "O docinho de todas as festas brasileiras: leite condensado e chocolate, enrolado em granulado.", "prep": 5, "cook": 15, "total": 20, "diff": "Fácil", "serves": 6, "ings": [[1, "lata", "leite condensado (395 g)"], [3, "c. sopa", "cacau ou chocolate em pó"], [1, "c. sopa", "manteiga (e mais um pouco para untar as mãos)"], [null, "", "granulado de chocolate, para enrolar"]], "steps": ["Põe o leite condensado, o cacau e a manteiga numa panela de fundo grosso.", "Coze em lume médio-baixo, sempre a mexer com uma colher de pau, 10 a 12 minutos.", "Está no ponto quando, ao inclinares a panela, a mistura se descola do fundo de uma vez ('ponto de brigadeiro').", "Deita num prato untado e deixa arrefecer por completo.", "Unta as mãos com manteiga, enrola bolinhas e passa-as pelo granulado.", "Põe em forminhas de papel. Se sobrarem — o que é raro — guardam-se no frigorífico."], "pair": ["Em festas, com outros docinhos", "Com um café", "Direto da colher, ainda na panela (versão 'brigadeiro de colher')"], "tip": "Não pares de mexer nem aumentes o lume para despachar: queima no fundo em segundos e o sabor fica estragado."}, {"pt": "Mac and cheese", "en": "American Mac & Cheese", "cats": ["massas", "vegetariano", "americana"], "day": "🇺🇸 Americana", "img": "http://plantquilt.com/wp-content/uploads/2026/03/ec5ya2sc51tqzy6rozcz.webp", "desc": "O prato de conforto mais famoso dos EUA: massa em molho de queijo bem cremoso.", "prep": 10, "cook": 20, "total": 30, "diff": "Fácil", "serves": 4, "ings": [[300, "g", "massa curta (cotovelos ou outra curta)"], [50, "g", "manteiga"], [40, "g", "farinha"], [600, "ml", "leite"], [250, "g", "queijo cheddar ralado"], [1, "c. chá", "mostarda (o truque do sabor)"], [null, "", "sal, pimenta e uma pitada de paprica"]], "steps": ["Coze a massa em água com sal, 1 minuto a menos do que diz a embalagem. Escorre.", "Derrete a manteiga, junta a farinha e coze 1 minuto a mexer — este é o roux, a base do molho.", "Junta o leite aos poucos, sempre a mexer, e coze até engrossar, uns 5 minutos.", "Tira do lume. Junta a mostarda e o queijo aos punhados, mexendo até derreter. Não voltes a ferver, senão o queijo fica granulado.", "Junta a massa ao molho e envolve bem.", "Serve logo, bem quente e a escorrer. (Versão de forno: gratina 10 minutos com pão ralado por cima.)"], "pair": ["Salada verde, para equilibrar", "Brócolos ou ervilhas ao lado", "Com frango assado, ao estilo americano"], "tip": "O molho faz-se fora do lume quando entra o queijo. É a diferença entre cremoso e granulado."}, {"pt": "Hambúrguer americano clássico", "en": "Classic American Cheeseburger", "cats": ["carne", "americana"], "day": "🇺🇸 Americana", "img": "https://iambaker.net/wp-content/uploads/2019/05/cheeseburger-1.jpg", "desc": "O original: carne bem temperada, queijo a derreter e pão tostado na manteiga.", "prep": 10, "cook": 10, "total": 20, "diff": "Fácil", "serves": 4, "ings": [[500, "g", "carne de vaca picada (com alguma gordura — 80/20 é o ideal)"], [4, "", "pães de hambúrguer"], [4, "fatias", "queijo cheddar ou americano"], [null, "", "alface, tomate, cebola e pickles"], [null, "", "maionese, ketchup e mostarda; sal e pimenta; manteiga para o pão"]], "steps": ["Divide a carne em 4 bolas e achata em hambúrgueres um pouco maiores que o pão (eles encolhem). Faz uma covinha no meio com o polegar.", "Tempera só com sal e pimenta, por fora, já na hora de grelhar.", "Grelha ou frigideira bem quente: 3 a 4 minutos de cada lado. Não apertes o hambúrguer — sai o sumo todo.", "No último minuto, põe o queijo por cima e tapa, para derreter.", "Tosta o pão cortado numa frigideira com um pouco de manteiga.", "Monta: molhos no pão, alface, tomate, hambúrguer com queijo, cebola e pickles. Serve já."], "pair": ["Batatas fritas", "Salada de repolho (coleslaw)", "Anéis de cebola fritos", "Um batido (milkshake), para o menu completo"], "tip": "A covinha no meio não é mania: impede o hambúrguer de inchar e ficar uma bola em vez de um disco."}, {"pt": "Sopa cremosa de milho e batata", "en": "American Corn Chowder", "cats": ["sopas", "americana"], "day": "🇺🇸 Americana", "img": "https://myhomemadecooking.com/wp-content/uploads/2026/04/AQPm3kXICXpV7FLuOwjSro6k2FvMETr6mzUuY1cVCaYvdPpr9EuuhKGGkJdclCM2AWiXFnRgV9NAGrIjOQq2GS74XRMxZyoGmbOckQWXYx2HOTHlJfR09XTfYqzfCSecJTqvt9NCfMwuFp2WaT1kuoWm0IMeuw-1776512641873.jpeg.webp", "desc": "Chowder bem cremoso, com milho doce, batata e um toque fumado do bacon.", "prep": 15, "cook": 30, "total": 45, "diff": "Fácil", "serves": 4, "ings": [[400, "g", "milho (fresco, congelado ou de lata escorrido)"], [2, "", "batatas em cubos pequenos"], [100, "g", "bacon em cubinhos"], [1, "", "cebola picada"], [2, "dentes", "alho picado"], [700, "ml", "caldo de galinha ou de legumes"], [200, "ml", "natas ou leite gordo"], [null, "", "sal, pimenta, tomilho e cebolinho"]], "steps": ["Frita o bacon numa panela até ficar crocante. Tira e guarda, deixando a gordura na panela.", "Refoga a cebola nessa gordura (ou em azeite) 4 minutos. Junta o alho.", "Junta a batata e o caldo. Coze 12 minutos, até a batata amaciar.", "Junta o milho e coze mais 5 minutos.", "Tritura um terço da sopa (ou esmaga parte da batata com um garfo) — é isso que a torna cremosa sem precisar de muita nata.", "Junta as natas, acerta o sal e a pimenta, e serve com o bacon crocante e cebolinho por cima."], "pair": ["Pão torrado ou bolachas de água e sal, como nos EUA", "Salada verde", "Sozinha, como refeição leve de inverno"], "tip": "Triturar só um terço é o truque do chowder: cremoso, mas ainda com pedaços para mastigar."}, {"pt": "Costelinhas com molho barbecue", "en": "American BBQ Ribs", "cats": ["carne", "americana"], "day": "🇺🇸 Americana", "img": "https://tasteandsee.com/wp-content/uploads/2025/04/22Secret-Sauce-BBQ-Baby-Back-Ribs-rect-OT-ribs_-2.jpg", "desc": "Costelinhas que se descolam do osso, com molho barbecue docinho e fumado. Lume baixo e tempo.", "prep": 15, "cook": 150, "total": 165, "diff": "Médio", "serves": 4, "ings": [[1000, "g", "costelinhas de porco (entrecosto)"], [2, "c. sopa", "açúcar mascavado"], [1, "c. sopa", "paprica (fumada, se tiveres)"], [1, "c. chá", "alho em pó"], [1, "c. chá", "cebola em pó"], [250, "ml", "molho barbecue de compra (ou caseiro)"], [null, "", "sal e pimenta"]], "steps": ["Tira a membrana fina da parte de trás das costelinhas (puxa com papel de cozinha — sai inteira). É ela que as deixa duras.", "Mistura o açúcar, a paprica, o alho e a cebola em pó, sal e pimenta. Esfrega bem em toda a carne.", "Embrulha bem em folha de alumínio, com a parte da carne para baixo.", "Forno baixo, 150°C, por 2 horas e meia. Baixo e devagar — não há atalhos.", "Desembrulha, pincela generosamente com molho barbecue.", "Volta ao forno (ou à grelha) a 200°C por 15 minutos, pincelando mais uma vez, até o molho ficar brilhante e pegajoso. Repousa 10 minutos e corta entre os ossos."], "pair": ["Salada de repolho (coleslaw)", "Milho cozido ou grelhado", "Batatas fritas ou assadas", "Pão de milho (cornbread), para o menu completo"], "tip": "O teste é simples: a carne deve ceder e quase cair do osso quando levantas a costelinha com uma pinça. Se resiste, precisa de mais tempo, não de mais calor."}, {"pt": "Tarte de maçã americana", "en": "American Apple Pie", "cats": ["sobremesas", "americana"], "day": "🇺🇸 Americana", "img": "https://insanelygoodrecipes.com/wp-content/uploads/2023/01/Apple-Pie-500x375.jpg", "desc": "A tarte dos filmes: maçãs com canela dentro de uma crosta dourada e estaladiça.", "prep": 30, "cook": 50, "total": 80, "diff": "Médio", "serves": 6, "ings": [[2, "folhas", "massa quebrada ou folhada (de compra serve bem)"], [6, "", "maçãs descascadas em fatias finas"], [120, "g", "açúcar"], [1, "c. sopa", "farinha"], [1, "c. chá", "canela"], [1, "c. sopa", "sumo de limão"], [20, "g", "manteiga em cubinhos"], [null, "", "1 ovo batido com um pouco de leite, para pincelar; uma pitada de sal e de noz-moscada"]], "steps": ["Mistura as maçãs com o açúcar, a farinha, a canela, o limão, o sal e a noz-moscada. Deixa 15 minutos — largam sumo e ganham sabor.", "Forra uma tarteira com uma folha de massa, deixando bordas a mais.", "Põe as maçãs dentro, com os cubinhos de manteiga por cima.", "Cobre com a segunda folha: ou inteira (com uns cortes no topo para sair o vapor), ou em tiras cruzadas, como nas fotos clássicas.", "Apara e dobra as bordas, pincela com o ovo batido.", "Forno a 190°C por 45 a 50 minutos, até dourar e o recheio borbulhar. Deixa arrefecer pelo menos 1 hora antes de cortar, para o recheio firmar."], "pair": ["Uma bola de gelado de baunilha (à la mode, como se diz lá)", "Natas batidas", "Uma fatia de queijo cheddar por cima — tradição antiga em partes dos EUA, experimenta antes de julgar!"], "tip": "A hora de arrefecimento não é espera perdida: tarte cortada quente desmancha-se e o recheio escorre todo."}, {"pt": "Bolo de chocolate com cobertura cremosa", "en": "Chocolate Cake with Creamy Frosting", "cats": ["bolos", "sobremesas"], "day": "🍰 Bolos", "img": "https://thedessertedgirl.com/wp-content/uploads/2022/07/ChocolateCreamCheeseCake4-1013x1024.jpg", "desc": "O bolo de chocolate fofo com a cobertura cremosa da página de técnicas. O favorito para aniversários.", "prep": 20, "cook": 35, "total": 55, "diff": "Médio", "serves": 8, "ings": [[250, "g", "farinha"], [75, "g", "cacau em pó"], [300, "g", "açúcar"], [2, "c. chá", "fermento"], [3, "", "ovos"], [200, "ml", "leite"], [120, "ml", "óleo"], [200, "ml", "água quente"], [200, "g", "manteiga à temperatura ambiente (cobertura)"], [300, "g", "açúcar em pó (cobertura)"], [50, "g", "cacau (cobertura) e 3 a 4 c. sopa de leite"]], "steps": ["Forno a 180°C. Unta e enfarinha uma forma redonda de 22 cm (ou duas de 20 cm).", "Mistura os secos: farinha, cacau, açúcar, fermento e uma pitada de sal.", "Junta ovos, leite e óleo e bate 2 minutos. Deita a água quente aos poucos — a massa fica líquida, é mesmo assim (é ela que dá um bolo húmido).", "Assa 30 a 35 minutos. O palito deve sair com migalhas húmidas, não molhado.", "Deixa arrefecer por completo antes de cobrir — cobertura em bolo quente derrete e escorre.", "Cobertura cremosa: bate a manteiga 2 minutos, junta o açúcar em pó e o cacau peneirados e o leite, e bate até ficar leve e de espalhar. Barra entre camadas e por cima, com voltas da espátula."], "pair": ["Um copo de leite bem fresco", "Café, para os adultos", "Gelado de baunilha ao lado"], "tip": "Bolo de chocolate guarda-se tapado à temperatura ambiente 2 dias — no frigorífico seca. Tira-o 30 minutos antes de servir.", "fp": [null, null, ["https://www.snixykitchen.com/wp-content/uploads/2022/04/Gluten-Free-German-Chocolate-Cake-2.jpg", "A massa, já misturada e brilhante"], null, null, ["http://nansbakes.rf.gd/wp-content/uploads/2024/03/Fudgy-Vegan-Chocolate-Cake-Butternut-Bakery.jpg", "A espalhar a cobertura cremosa com a espátula"]]}, {"pt": "Bolo de cenoura com cobertura de brigadeiro", "en": "Brazilian Carrot Cake with Brigadeiro Frosting", "cats": ["bolos", "sobremesas", "brasileira"], "day": "🍰 Bolos", "img": "https://magiadosaromas.com.br/wp-content/uploads/2023/08/bolo-de-cenoura.jpg.webp", "desc": "O bolo laranja do Brasil: cenoura batida na massa e uma camada generosa de brigadeiro mole por cima.", "prep": 15, "cook": 40, "total": 55, "diff": "Fácil", "serves": 8, "ings": [[3, "", "cenouras médias descascadas"], [4, "", "ovos"], [240, "ml", "óleo"], [300, "g", "açúcar"], [320, "g", "farinha"], [1, "c. sopa", "fermento"], [1, "lata", "leite condensado (cobertura)"], [3, "c. sopa", "cacau (cobertura) e 1 c. sopa de manteiga"]], "steps": ["Bate no liquidificador as cenouras, os ovos, o óleo e o açúcar até ficar um creme laranja bem liso.", "Deita numa tigela, junta a farinha peneirada e mexe. O fermento entra no fim, só a envolver.", "Forma untada de 24 cm, forno a 180°C por 35 a 40 minutos.", "Cobertura: leva o leite condensado, o cacau e a manteiga ao lume, mexendo sempre, até engrossar um pouco (ponto de brigadeiro mole, uns 6 minutos).", "Deita a cobertura quente por cima do bolo morno — ela escorre pelas bordas, como deve ser."], "pair": ["Café passado na hora", "Um copo de leite", "Sozinho, ao lanche — como no Brasil"], "tip": "A massa bate-se no liquidificador, mas a farinha mistura-se à mão. Se bateres a farinha, o bolo fica pesado."}, {"pt": "Bolo de laranja", "en": "Portuguese Orange Cake", "cats": ["bolos", "sobremesas", "portuguesa"], "day": "🍰 Bolos", "img": "https://www.foodfromportugal.com/content/uploads/2012/11/orange-cake-02.jpg", "desc": "Bolo de casa português: leve, a saber a laranja de verdade, ótimo para o chá.", "prep": 15, "cook": 35, "total": 50, "diff": "Fácil", "serves": 8, "ings": [[4, "", "ovos"], [200, "g", "açúcar"], [200, "g", "farinha"], [100, "ml", "óleo ou manteiga derretida"], [1, "", "laranja (sumo e raspa)"], [1, "c. chá", "fermento"], [null, "", "açúcar em pó, para polvilhar"]], "steps": ["Bate os ovos com o açúcar até ficar claro e fofo, uns 3 minutos.", "Junta o sumo e a raspa da laranja e o óleo, e mexe.", "Envolve a farinha e o fermento peneirados, sem bater.", "Forma de buraco untada, forno a 180°C por 30 a 35 minutos.", "Deixa amornar, desenforma e polvilha com açúcar em pó."], "pair": ["Chá preto ou de ervas", "Café da tarde", "Uma colher de iogurte grego ao lado"], "tip": "Usa a raspa só da parte laranja da casca — a parte branca amarga o bolo."}, {"pt": "Bolo urso", "en": "Bear Cake", "cats": ["bolos", "sobremesas"], "day": "🍰 Bolos", "img": "https://www.kindmeal.my/photos/moment/22/22013-39614-l.jpg", "desc": "Um bolo de baunilha disfarçado de urso: orelhas, focinho e muito chocolate. Diversão garantida com miúdos.", "prep": 40, "cook": 35, "total": 75, "diff": "Médio", "serves": 8, "ings": [[1, "receita", "de bolo de baunilha ou de chocolate (a massa que já sabes fazer)"], [200, "g", "cobertura de chocolate cremosa"], [2, "", "bolachas redondas de chocolate (as orelhas)"], [1, "", "bolacha clara grande (o focinho)"], [null, "", "smarties ou pepitas de chocolate (olhos e nariz); coco ralado (o pêlo, se quiseres)"]], "steps": ["Faz um bolo redondo de 20 a 22 cm e deixa arrefecer por completo. Frio, não se desmancha a cortar nem a barrar.", "Corta dois círculos pequenos de um segundo bolo fino (ou usa as bolachas grandes) para as orelhas, no topo.", "Barra todo o bolo com a cobertura de chocolate, sem pressa — as imperfeições são o 'pêlo' do urso.", "Põe as orelhas, a bolacha clara como focinho, e desenha o nariz e a boca com chocolate derretido ou pepitas.", "Olhos de smarties, e já está: fotografa antes de cortar, porque ele desaparece depressa."], "pair": ["Leite achocolatado para os miúdos", "Numa festa, com sumos e fruta cortada", "Gelado ao lado"], "tip": "Monta o urso já no prato onde vais servir. Mover um bolo decorado é a parte mais arriscada de todas."}, {"pt": "Bolo de ananás virado", "en": "Pineapple Upside-Down Cake", "cats": ["bolos", "sobremesas"], "day": "🍰 Bolos", "img": "https://www.elizabethskitchendiary.co.uk/wp-content/uploads/2016/09/Pineapple-upside-down-cake-recipe-image.jpg", "desc": "Assa ao contrário: o ananás caramelizado fica no fundo da forma e vira a estrela quando desenformas.", "prep": 20, "cook": 40, "total": 60, "diff": "Médio", "serves": 8, "ings": [[1, "lata", "ananás em rodelas (guarda o sumo)"], [100, "g", "açúcar mascavado"], [50, "g", "manteiga"], [200, "g", "farinha"], [180, "g", "açúcar"], [3, "", "ovos"], [100, "ml", "leite ou sumo do ananás"], [1, "c. chá", "fermento; cerejas em calda (se quiseres, para o meio das rodelas)"]], "steps": ["Derrete a manteiga no fundo de uma forma de 24 cm, espalha o açúcar mascavado e arruma as rodelas de ananás por cima, bonitas — é este lado que vai aparecer.", "Bate ovos e açúcar, junta leite, farinha e fermento, sem bater demais.", "Deita a massa por cima do ananás, com cuidado para não o mexer.", "Forno a 180°C por 35 a 40 minutos.", "Repousa 10 minutos e vira o bolo para o prato de servir com um movimento decidido. Se uma rodela ficar na forma, tira-a e põe no sítio — ninguém nota."], "pair": ["Natas batidas", "Gelado de baunilha ou de coco", "Chá, ao lanche"], "tip": "Desenforma morno, nunca frio: o caramelo frio cola o ananás à forma."}, {"pt": "Bolo de banana", "en": "Banana Bread Cake", "cats": ["bolos"], "day": "🍰 Bolos", "img": "https://platecrest.link/wp-content/uploads/2026/01/3-9.webp", "desc": "A solução para as bananas muito maduras: bolo húmido, denso e a cheirar a c
